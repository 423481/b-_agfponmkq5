              function dashStationRow(k, s) {

              function dashExportCard() {

<script type="text/x-mohr-section" data-mohr-section="features/stops/owned-openStops" data-order="31.0625">

              function openStops() {
                return (S.stops || []).filter(function (x) {
                  return !x.endAt;
                });
              }
              function stopTab() {
                var n = openStops().length;
                return (
                  '<button class="tab" role="tab" data-act="tab" data-t="stop" aria-selected="' +
                  (S.tab === 'stop') +
                  '">توقف خط' +
                  (n ? '<span class="cnt">' + fa(n) + '</span>' : '') +
                  '</button>'
                );
              }
              function stopOptions(list, cur) {
                var all = cur && list.indexOf(cur) < 0 ? list.concat([cur]) : list;
                return all
                  .map(function (v) {
                    return '<option' + (v === cur ? ' selected' : '') + '>' + esc(v) + '</option>';
                  })
                  .join('');
              }
              function minuteOfDay(iso) {
                return Math.floor(((Date.parse(iso) + TEHRAN_MS) % DAY_MS) / 60000);
              }
              function stopTimeMs(min) {
                return dayStart(Date.now()) + min * 60000;
              }
              function stopError(line, reason, sm, em, now) {
                if (!line || !reason) return 'خط و دلیل توقف را انتخاب کنید.';
                if ((val('st_from') && sm == null) || (val('st_to') && em == null))
                  return 'ساعت را فقط با عدد بنویسید (مثلاً ۰۹۳۰).';
                var start = sm == null ? now : stopTimeMs(sm);
                if (start > now + 60000) return 'ساعت شروع از الان دیرتر است.';
                if (em != null) {
                  var end = stopTimeMs(em);
                  if (end <= start) return 'ساعت پایان باید بعد از ساعت شروع باشد.';
                  if (end > now + 60000) return 'ساعت پایان از الان دیرتر است.';
                }
                if (
                  em == null &&
                  openStops().some(function (x) {
                    return x.line === line;
                  })
                )
                  return 'برای این خط یک توقف باز هست؛ اول آن را پایان دهید.';
                return '';
              }
              function stopAdd() {
                var line = val('st_line'),
                  reason = val('st_reason'),
                  now = Date.now();
                var sm = val('st_from') ? parseHm(val('st_from')) : null,
                  em = val('st_to') ? parseHm(val('st_to')) : null;
                var err = stopError(line, reason, sm, em, now);
                if (err) {
                  toast(err);
                  return;
                }
                var doc = {
                  kind: 'stop',
                  line: line,
                  reason: reason,
                  note: val('st_note'),
                  startAt: new Date(sm == null ? now : stopTimeMs(sm)).toISOString(),
                  endAt: em == null ? '' : new Date(stopTimeMs(em)).toISOString(),
                  by: S.user.name,
                  byId: S.user.id,
                  at: nowIso(),
                };
                ['st_from', 'st_to', 'st_note'].forEach(function (k) {
                  var e = document.getElementById(k);
                  if (e) e.value = '';
                });
                save(function () {
                  return store.set('users', 'stop_' + uid(), doc);
                }, 'توقف ثبت شد');
              }
              /* خطای ویرایش توقف؛ ساعت‌ها روی همان روزِ شروع توقف حساب می‌شوند */
              function stopEditError(x, line, reason, sm, em, now) {
                if (!line || !reason) return 'خط و دلیل توقف را انتخاب کنید.';
                if (sm == null || (val('se_to') && em == null))
                  return 'ساعت را فقط با عدد بنویسید (مثلاً ۰۹۳۰).';
                var day = dayStart(Date.parse(x.startAt)),
                  start = day + sm * 60000,
                  end = em == null ? 0 : day + em * 60000;
                if (start > now + 60000 || end > now + 60000) return 'ساعت از الان دیرتر است.';
                if (em != null && end <= start) return 'ساعت پایان باید بعد از ساعت شروع باشد.';
                if (
                  em == null &&
                  openStops().some(function (o) {
                    return o.id !== x.id && o.line === line;
                  })
                )
                  return 'برای این خط یک توقف باز دیگر هست؛ اول آن را پایان دهید.';
                return '';
              }
              function stopEdit(id) {
                var x = (S.stops || []).filter(function (r) {
                  return r.id === id;
                })[0];
                if (!x) return;
                var line = val('se_line'),
                  reason = val('se_reason'),
                  sm = parseHm(val('se_from')),
                  em = val('se_to') ? parseHm(val('se_to')) : null;

                    editById: S.user.id,
                    editAt: nowIso(),

                S.stopEdit = '';
                save(function () {
                  return store.update('users', id, ch);
                }, 'توقف ویرایش شد');
              }
              function stopEnd(id) {

              function stopEditForm(x) {

                  '<form data-form="stopedit" data-id="' +

                  '</select></label>' +
                  '<div class="mgrow"><label class="f">ساعت شروع<input class="in num ltr" id="se_from" inputmode="numeric" autocomplete="off" value="' +
                  fmtHm(minuteOfDay(x.startAt)) +
                  '"></label>' +
                  '<label class="f">ساعت پایان (خالی = هنوز ادامه دارد)<input class="in num ltr" id="se_to" inputmode="numeric" autocomplete="off" value="' +
                  (x.endAt ? fmtHm(minuteOfDay(x.endAt)) : '') +
                  '"></label></div>' +
                  '<label class="f">توضیح<input class="in" id="se_note" autocomplete="off" value="' +
                  esc(x.note || '') +
                  '"></label>' +
                  '<div class="row"><button class="btn primary sm" type="submit">ذخیره‌ی تغییر</button><button class="btn sm" type="button" data-act="stopeditno">انصراف</button></div></div></form>'
                );
              }
              function stopManageBtns(x) {
                if (S.stopDel === x.id)
                  return (
                    '<div class="row" style="margin-top:8px"><button class="btn sm" data-act="stopdelyes" data-id="' +

                    '">تأیید حذف</button><button class="btn sm" data-act="stopdelno">انصراف</button></div>'
                  );
                return (
                  '<div class="row" style="margin-top:8px"><button class="btn sm" data-act="stopedit" data-id="' +
                  esc(x.id) +
                  '">ویرایش</button><button class="btn sm" data-act="stopdelask" data-id="' +
                  esc(x.id) +
                  '">حذف</button></div>'
                );
              }

                if (canEnd && S.stopEdit === x.id) return stopEditForm(x);
                var end = x.endAt ? Date.parse(x.endAt) : now,
                  dur = elapsedTxt(end - Date.parse(x.startAt));

                  esc(x.line) +
                  '</b><span class="chip ' +
                  (x.endAt ? 'closed' : 'open') +
                  '">' +
                  (x.endAt ? 'پایان یافته' : 'باز') +
                  '</span></div>' +
                  '<div class="m">دلیل: ' +
                  esc(x.reason) +
                  '</div>' +
                  '<div class="m">شروع: ' +
                  esc(dateOnly(x.startAt)) +
                  ' — ساعت ' +
                  esc(hm(x.startAt)) +
                  '</div>' +
                  (x.endAt
                    ? '<div class="m">پایان: ' +

                    : '') +
                  '<div class="m">مدت: ' +
                  dur +
                  '</div>' +
                  (x.note ? '<div class="m">توضیح: ' + esc(x.note) + '</div>' : '') +
                  '<div class="m">' +
                  whoWhen(x.by, x.at, 'ثبت‌کننده') +
                  '</div>' +
                  (x.editAt
                    ? '<div class="m">' + whoWhen(x.editBy, x.editAt, 'ویرایش‌کننده') + '</div>'
                    : '') +
                  (canEnd && !x.endAt
                    ? '<button class="btn sm primary" data-act="stopend" data-id="' +
                      esc(x.id) +

                  ctx.lineTo(PW - M, M + 74);
                  ctx.stroke();
                  pages.push(cv);
                  y = M + 94;
                }
                function wrap(t, mw) {
                  var lines = [],
                    cur = '';
                  String(t || '')
                    .split(/\s+/)
                    .forEach(function (w) {
                      var test = cur ? cur + ' ' + w : w;
                      if (ctx.measureText(test).width > mw && cur) {
                        lines.push(cur);
                        cur = w;
                      } else cur = test;
                    });
                  lines.push(cur);
                  return lines;
                }
                function columns(sec) {
                  var total = sec.w.reduce(function (a, b) {
                      return a + b;
                    }, 0),
                    x = PW - M;
                  return sec.w.map(function (w) {
                    var cw = ((PW - 2 * M) * w) / total,
                      c = { r: x, w: cw };
                    x -= cw;
                    return c;
                  });
                }
                function drawRow(cols, cells, bold, bg) {
                  font(19, bold);
                  var lines = cells.map(function (v, i) {
                      return wrap(v, cols[i].w - pad * 2);
                    }),
                    n = Math.max.apply(
                      null,
                      lines.map(function (l) {
                        return l.length;
                      }),
                    ),
                    h = n * LH + pad * 2;
                  if (y + h > PH - M - 40) return h;
                  if (bg) {
                    ctx.fillStyle = bg;
                    ctx.fillRect(M, y, PW - 2 * M, h);
                  }
                  ctx.fillStyle = bold ? '#14213d' : '#1b1b1b';
                  ctx.strokeStyle = '#c4ccda';
                  ctx.lineWidth = 1;
                  ctx.strokeRect(M, y, PW - 2 * M, h);
                  lines.forEach(function (l, i) {
                    l.forEach(function (t, k) {
                      ctx.fillText(t, cols[i].r - pad, y + pad + k * LH);
                    });
                    ctx.beginPath();
                    ctx.moveTo(cols[i].r - cols[i].w, y);
                    ctx.lineTo(cols[i].r - cols[i].w, y + h);

                      newPage();

                      drawRow(cols, cells, bold, bg);
                    }
                  }
                  font(26, 1);
                  ctx.fillStyle = '#14213d';
                  if (y + 120 > PH - M - 40) newPage();
                  ctx.fillText(sec.n, PW - M, y);

                  sec.r.slice(1).forEach(function (r) {
                    put(r, 0);
                  });

                }
                newPage();
                secs.forEach(table);
                pages.forEach(function (p, i) {
                  var c = p.getContext('2d');

                  c.textBaseline = 'top';
                  c.fillStyle = '#555';

                  c.fillText(i + 1 + ' / ' + pages.length, PW / 2, PH - M);
                });
                return packPdf(pages, PW, PH);
              }
              /* بسته‌بندی صفحه‌های canvas (JPEG) در یک PDF ساده */
              function packPdf(pages, PW, PH) {
                var enc = new TextEncoder(),
                  chunks = [],
                  len = 0,
                  offs = [],
                  n = pages.length,
                  N = 2 + 3 * n;
                function add(u) {
                  chunks.push(u);
                  len += u.length;
                }
                function addS(s) {
                  add(enc.encode(s));
                }
                addS('%PDF-1.4\n');
                offs[1] = len;
                addS('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
                var kids = [];
                for (var i = 0; i < n; i++) kids.push(3 + 3 * i + ' 0 R');
                offs[2] = len;
                addS(
                  '2 0 obj\n<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + n + ' >>\nendobj\n',
                );
                pages.forEach(function (p, i) {
                  var bin = atob(p.toDataURL('image/jpeg', 0.9).split(',')[1]),
                    u = new Uint8Array(bin.length);
                  for (var k = 0; k < bin.length; k++) u[k] = bin.charCodeAt(k);
                  var po = 3 + 3 * i,
                    co = 4 + 3 * i,
                    io = 5 + 3 * i,
                    cs = 'q 595 0 0 842 0 0 cm /Im0 Do Q';
                  offs[po] = len;
                  addS(
                    po +
                      ' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 ' +
                      io +
                      ' 0 R >> >> /Contents ' +
                      co +
                      ' 0 R >>\nendobj\n',
                  );
                  offs[co] = len;
                  addS(
                    co +
                      ' 0 obj\n<< /Length ' +
                      cs.length +
                      ' >>\nstream\n' +
                      cs +
                      '\nendstream\nendobj\n',
                  );
                  offs[io] = len;
                  addS(
                    io +
                      ' 0 obj\n<< /Type /XObject /Subtype /Image /Width ' +
                      PW +
                      ' /Height ' +
                      PH +
                      ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' +
                      u.length +
                      ' >>\nstream\n',
                  );
                  add(u);
                  addS('\nendstream\nendobj\n');
                });
                var xo = len,
                  x = 'xref\n0 ' + (N + 1) + '\n0000000000 65535 f \n';
                for (var j = 1; j <= N; j++) x += ('0000000000' + offs[j]).slice(-10) + ' 00000 n \n';
                addS(
                  x + 'trailer\n<< /Size ' + (N + 1) + ' /Root 1 0 R >>\nstartxref\n' + xo + '\n%%EOF',
                );

              }
              function dashExport(kind) {
                var F = dashF(),
                  now = Date.now(),
                  secs = dashSections(F, dashResult(F, now), now),
                  base = 'quality-dashboard-' + new Date(now).toISOString().slice(0, 10);
                if (kind === 'xlsx') return saveFile(base + '.xlsx', packXlsx(secs));
                var sub =
                  'تاریخ تهیه: ' +
                  dateOnly(new Date(now).toISOString()) +
                  '   ساعت: ' +
                  hm(new Date(now).toISOString()) +
                  '   تهیه‌کننده: ' +
                  S.user.name;
                var ld =
                  document.fonts && document.fonts.load
                    ? Promise.all([
                        document.fonts.load('400 22px Vazirmatn'),
                        document.fonts.load('700 22px Vazirmatn'),
                      ]).catch(function () {})
                    : Promise.resolve();
                return ld.then(function () {
                  return saveFile(base + '.pdf', buildDashPdf(secs, sub));
                });
              }
      // END SECTION: dashboard/export
    
</script>
