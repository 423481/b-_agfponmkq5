    function go(off){return sbFetch(c+'?select=id,updated_at'+extra+'&order=id&limit=1000&offset='+off).then(function(r){r=r||[];out=out.concat(r);return r.length>=1000?go(off+1000):out})}

    var parts=[];for(var i=0;i<ids.length;i+=40)parts.push(ids.slice(i,i+40));
    return Promise.all(parts.map(function(p){return sbFetch(c+'?select=id,updated_at&id=in.('+p.map(function(x){return encodeURIComponent(q(x))}).join(',')+')')})).then(function(res){res.forEach(function(a){meta=meta.concat(a||[])});return meta});
  }
  function addRows(c,arr){var m=cache[c]=cache[c]||{};(arr||[]).forEach(function(r){m[r.id]={data:r.data||{},at:r.updated_at};(pins[c]=pins[c]||{})[r.id]=1})}
  function inList(vs){return 'in.('+vs.map(function(v){return encodeURIComponent(q(v))}).join(',')+')'}
  function carRound(vs){
    var ids=[];Object.keys(SHEETS).forEach(function(sh){vs.forEach(function(v){ids.push(sh+'_'+v)})});
    var reqs=[];
    for(var i=0;i<ids.length;i+=40)reqs.push(sbFetch('inspections?select=id,data,updated_at&id='+inList(ids.slice(i,i+40))));
    ['key','serial','chassisNo','engine','room'].forEach(function(f){reqs.push(sbFetch('inspections?select=id,data,updated_at&data-%3E%3E'+f+'=in.('+vs.join(',')+')'))});
    reqs.push(sbFetch('archives?select=id,data,updated_at&id='+inList(vs)).then(function(a){addRows('archives',a);return []}));
    return Promise.all(reqs).then(function(res){var rows=[];res.forEach(function(a){rows=rows.concat(a||[])});return rows});
  }
  function fetchCar(vals){

    if(!vs.length)return Promise.resolve();

    return carRound(vs).then(function(rows){
      addRows('inspections',rows);
      var more=[];rows.forEach(function(r){var d=r.data||{};[d.key,d.serial,d.chassisNo,d.engine,d.room].forEach(function(v){v=v&&String(v);if(v&&/^[A-Za-z0-9]{3,20}$/.test(v)&&!done[v]){done[v]=1;more.push(v)}})});
      if(!more.length)return;
      return carRound(more.slice(0,12)).then(function(r2){addRows('inspections',r2)});
    }).then(function(){emit('inspections');emit('archives')});
  }
  function fetchSince(days){
    var since=new Date(Date.now()-days*86400000).toISOString();
    function go(off){return sbFetch('inspections?select=id,data,updated_at&updated_at=gte.'+since+'&order=id&limit=500&offset='+off).then(function(r){r=r||[];addRows('inspections',r);return r.length>=500?go(off+500):null})}

  var last={},nFull={},FULLMS=300000;

  function delta(c){

        r.forEach(function(x){last[c]=maxAt(x.updated_at,last[c]);if(!m[x.id]||m[x.id].at!==x.updated_at){m[x.id]={data:x.data||{},at:x.updated_at};got=true}});
        return r.length>=1000?go(off+1000):null;

  }
  function poll(c){
    if(busy[c])return;busy[c]=true;
    if(last[c]&&nFull[c]&&Date.now()-nFull[c]<FULLMS&&!isNaN(Date.parse(last[c]))){cache[c]=cache[c]||{};return delta(c)}
    metaAll(c).then(function(meta0){return pinMeta(c,meta0)}).then(function(meta){
      nFull[c]=Date.now();(meta||[]).forEach(function(r){last[c]=maxAt(r.updated_at,last[c])});
      var m=cache[c]=cache[c]||{},seen={},need=[],changed=false;
      (meta||[]).forEach(function(r){seen[r.id]=1;if(!m[r.id]||m[r.id].at!==r.updated_at)need.push(r.id)});
      Object.keys(m).forEach(function(id){if(!seen[id]){delete m[id];changed=true}});
      if(!need.length){busy[c]=false;if(changed)emit(c);return}
      var parts=[];for(var i=0;i<need.length;i+=40)parts.push(need.slice(i,i+40));
      return Promise.all(parts.map(function(ids){return sbFetch(c+'?select=id,data,updated_at&id=in.('+ids.map(function(x){return encodeURIComponent(q(x))}).join(',')+')')})).then(function(res){
        res.forEach(function(arr){(arr||[]).forEach(function(r){m[r.id]={data:r.data||{},at:r.updated_at}})});

    }).catch(function(){busy[c]=false});
  }
  function put(c,id,d){

      (cache[c]=cache[c]||{})[id]={data:d,at:'local-'+Date.now()};emit(c);setTimeout(function(){poll(c)},300);
    });
  }
  return {mode:'shared',supa:true,fetchCar:fetchCar,fetchSince:fetchSince,
    set:function(c,id,d){return put(c,id,d)},
    update:function(c,id,d){
      /* v109: قفل خوش‌بینانه — نوشتن فقط اگر updated_at از زمان خواندن عوض نشده باشد؛ وگرنه دوباره بخوان و ادغام کن */
      var tries=0;
      function attempt(){
        return sbFetch(c+'?select=data,updated_at&id=eq.'+encodeURIComponent(id)).then(function(r){
          var row=r&&r[0];
          if(!row)return put(c,id,deepMerge({},d));
          var merged=deepMerge(row.data||{},d);
          return sbFetch(c+'?id=eq.'+encodeURIComponent(id)+'&updated_at=eq.'+encodeURIComponent(row.updated_at),{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({data:merged,updated_at:new Date().toISOString()})}).then(function(res){
            if(res&&res.length){(cache[c]=cache[c]||{})[id]={data:merged,at:'local-'+Date.now()};emit(c);setTimeout(function(){poll(c)},300);return}
            if(++tries<5)return new Promise(function(ok){setTimeout(ok,80+Math.random()*220)}).then(attempt);
            throw new Error('تداخل ذخیره؛ دوباره تلاش کنید');
          });
        });
      }
      return attempt();
    },
    del:function(c,id){return sbFetch(c+'?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:{Prefer:'return=minimal'}}).then(function(){if(cache[c])delete cache[c][id];emit(c)})},
    sub:function(c,f){
      (subs[c]=subs[c]||[]).push(f);poll(c);
      if(!timers[c])timers[c]=setInterval(function(){if(!document.hidden)poll(c)},c==='inspections'?5000:10000);
    }};
}

function offWrap(st){

    if(OFF.q.length)return Promise.resolve(queue());
    var p=k==='del'?st.del(c,id):k==='set'?st.set(c,id,d):st.update(c,id,d);
    return p.catch(function(e){if(isNetErr(e))return queue();throw e});
  }
  var w=Object.assign({},st);w.raw=st;
  w.set=function(c,id,d){return run('set',c,id,d)};
  w.update=function(c,id,d){if(c==='inspections'&&d&&d.items)d=markS(id,d);return run('update',c,id,d)};
  w.del=function(c,id){return run('del',c,id)};

function offFlush(){
  if(OFF.busy||!OFF.q.length||!store||!store.raw)return;

    if(!o){OFF.busy=false;if(OFF.sent){OFF.sent=0;toast('تغییرات ذخیره‌شده‌ی آفلاین ارسال شد')}reapply();return}
    var st=store.raw,p=o.k==='del'?st.del(o.c,o.id):o.k==='set'?st.set(o.c,o.id,o.d):st.update(o.c,o.id,o.d);

      if(isNetErr(e)){OFF.busy=false;return}
      OFF.q.shift();OFF.failed++;offSave();step();
    });
  })();
}

function sameRow(a,b){

    n++;
    if(a[k]!==b[k])return JSON.stringify(a)===JSON.stringify(b);
  }

function changedRows(oldRows,newRows){

function isOwnerLogin(code){
  var rec=S.ownerRec;if(!rec)return false;
  if(rec.code)return code===rec.code;
  return !S.data.users.some(function(x){return x.id===code});
}
function enterOwner(){S.isOwner=true;S.ownerErr='';S.loginErr='';S.user={id:'owner',name:'علی بابایی',station:'owner'};S.tab='admin';S.key='';reapply()}
function ownerPwOk(pw){var rec=S.ownerRec;if(rec&&!rec.hash){var v=verGet('owner');if(!v)return Promise.resolve(false);rec={salt:v.salt,hash:v.hash}}if(!rec)return Promise.resolve(false);return Promise.all([pw,fnum(pw)].filter(function(x,i,a){return a.indexOf(x)===i}).map(function(c){return sha(rec.salt+c)})).then(function(hs){return hs.indexOf(rec.hash)>=0})}

function loginLocal(code,pw,rawPw,trusted){
  if(isOwnerLogin(code)){(trusted?Promise.resolve(true):ownerPwOk(rawPw)).then(function(ok){if(!ok){S.loginErr='کد پرسنلی یا رمز درست نیست.';render();return}var needCode=!S.ownerRec.code;enterOwner();if(needCode)toast('کد پرسنلی مدیر را در کارت بالای این صفحه ثبت کنید')});return}
  var u=S.data.users.filter(function(x){return x.id===code})[0];
  if(!u){S.loginErr=trusted?'اطلاعات کاربران هنوز بارگیری نشده؛ چند ثانیه بعد دوباره امتحان کنید.':'کد پرسنلی یا رمز درست نیست.';render();return}
  var vf=u.hash?{salt:u.salt,hash:u.hash}:verGet(u.id);
  if(!vf){S.loginErr='برای اولین ورود روی این دستگاه باید اینترنت وصل باشد.';render();return}
  (trusted?Promise.resolve(vf.hash):sha(vf.salt+pw)).then(function(hh){
    if(hh!==vf.hash){S.loginErr='کد پرسنلی یا رمز درست نیست.';render();return}
    S.user={id:u.id,name:u.name,station:u.station==='engine'?'chassis':u.station,sec:u.sec||'',role:u.role||''};S.loginErr='';S.forgot=false;var ms=mySheets();S.sheet=ms[0]||'chassis';S.key='';S.tab=u.station==='commercial'?'car':u.station==='planning'?'short':'inspect';S.tm=false;sessSave(u);reapply();if(navOK())navArm();

}

function stepSec(d,edit){

  return null;

function stepIdx(d,sc,vi){
  var k=d.id+'|'+sc.id,v=S.step&&S.step[k];
  if(v!==undefined&&v>=0&&v<=vi.length)return v;
  var items=d.items||{};
  for(var i=0;i<vi.length;i++){var id=secItemId(sc,vi[i].i);if(!(items[id]&&items[id].r))return i}

  var vi=visItems(d,sc),items=d.items||{},pos=-1,i,nx=vi.length;
  vi.forEach(function(x,j){if(secItemId(sc,x.i)===id)pos=j});
  var un=function(j){var iid=secItemId(sc,vi[j].i);return iid!==id&&!(items[iid]&&items[iid].r)};
  for(i=pos+1;i<vi.length;i++)if(un(i)){nx=i;break}
  if(nx===vi.length)for(i=0;i<=pos&&i<vi.length;i++)if(un(i)){nx=i;break}
  S.step=S.step||{};S.step[d.id+'|'+sc.id]=nx;S.fresh=id;
}

function qualityCard(y,m){
  var prod={},ngKey={},perSt={},par={},ngTotal=0,gr={};
  ASSEMBLY.forEach(function(k){perSt[k]=0});
  S.data.insp.forEach(function(r){
    if(ASSEMBLY.indexOf(r.sheet)<0||!SHEETS[r.sheet]||r.test)return;
    if(S.rprod&&prodOf(r)!==S.rprod)return;
    if(r.sheet==='final1'){var j=jal(r.createdAt);if(j&&j.y===y&&j.m===m)prod[r.key]=1}
    Object.keys(r.items||{}).forEach(function(id){
      var it=r.items[id];if(it.r!=='ng')return;
      ngKey[r.key]=1;
      var j=jal(it.at);if(!(j&&j.y===y&&j.m===m))return;
      ngTotal++;perSt[r.sheet]++;var gg=gradeOf(r,id)||'بدون گرید';gr[gg]=(gr[gg]||0)+1;
      var lb=it.custom?(it.part||it.free||it.note||'توضیح دستی'):labelOf(r.sheet,id,r);
      var k=SHEETS[r.sheet].name+' - '+lb;par[k]=(par[k]||0)+1;
    });
  });

  if(!cars&&!ngTotal)return h+'<p class="hint" style="margin:0">داده‌ای برای این ماه ثبت نشده است.</p></div>';
  var dpu=cars?ngTotal/cars:0,ftq=cars?Math.round((cars-bad)*1000/cars)/10:0;
  h+='<div class="kvs"><div class="kv"><small>DPU (ایراد به ازای هر خودرو)</small><b>'+fa(Math.round(dpu*100)/100)+'</b></div><div class="kv"><small>FTQ (بدون ایراد در بار اول)</small><b>'+fa(ftq)+'٪</b></div><div class="kv"><small>خودروی تولیدشده</small><b>'+fa(cars)+'</b></div><div class="kv"><small>کل ایرادها</small><b>'+fa(ngTotal)+'</b></div></div>';
  h+='<p class="hint" style="margin:8px 0">فقط «ایراد» شمرده می‌شود (کسری و قطعه نمونه نه). FTQ یعنی خودروهایی که در هیچ ایستگاهی ایراد نگرفته‌اند.</p>';
  h+='<div class="tbl"><table><thead><tr><th>ایستگاه</th><th>ایراد</th><th>DPU</th></tr></thead><tbody>';
  ASSEMBLY.forEach(function(k){h+='<tr><td>'+esc(SHEETS[k].name)+'</td><td>'+fa(perSt[k])+'</td><td>'+fa(cars?Math.round(perSt[k]*100/cars)/100:0)+'</td></tr>'});
  h+='</tbody></table></div>';
  var arr=Object.keys(par).map(function(k){return {k:k,n:par[k]}}).sort(function(a,b){return b.n-a.n}).slice(0,8),cum=0;
  if(arr.length){
    h+='<h3 style="margin:16px 0 8px;font-size:15px">پارتو: پرتکرارترین ایرادها</h3>';
    arr.forEach(function(x){cum+=x.n;var pc=Math.round(x.n*100/ngTotal),cp=Math.round(cum*100/ngTotal);
      h+='<div style="margin:6px 0"><div style="display:flex;justify-content:space-between;gap:8px;font-size:13px"><span>'+esc(x.k)+'</span><span class="num">'+fa(x.n)+' ('+fa(pc)+'٪ - تجمعی '+fa(cp)+'٪)</span></div><div style="height:10px;background:#8883;border-radius:5px"><div style="height:10px;width:'+(x.n*100/arr[0].n)+'%;background:#c0392b;border-radius:5px"></div></div></div>'});
  }
  if(S.rprod!=='padra'&&Object.keys(gr).some(function(k){return k!=='بدون گرید'})){
    h+='<h3 style="margin:16px 0 8px;font-size:15px">ایرادها بر اساس گرید (آیتم‌های اکستند)</h3><div class="tbl"><table><thead><tr><th>گرید</th><th>تعداد ایراد</th></tr></thead><tbody>';
    Object.keys(gr).sort().forEach(function(k){h+='<tr><td>'+esc(k)+'</td><td>'+fa(gr[k])+'</td></tr>'});
    h+='</tbody></table></div><p class="hint" style="margin-top:6px">گرید فقط برای آیتم‌های فهرست اکستند ثبت شده است.</p>';
  }
  return h+'</div>';
}

    var rec=Object.assign(idVals(S.sheet,'c_'),{sheet:S.sheet,key:S.key,createdBy:S.user.name,createdAt:nowIso(),formCode:FORM_CODE,formPage:SHEETS[S.sheet].page,items:{},signs:{}});
    var tmc=TM();if(tmc)rec.test=true;
    ensureCar([S.key,rec.engine,rec.chassisNo,rec.room,rec.serial]).then(function(){
    var vKey=tmc?'':withP(rec.product||'',function(){return numErr(SHEETS[S.sheet].keyKind,S.key)});

        rec.product=carProd(S.key,[ce,te])||undefined;
        if(rec.product===undefined)delete rec.product;
        if(!ce)w.push('برگه شاسی '+ch+' هنوز ثبت نشده است.');
        if(!insp('trim',rm))w.push('برگه تزیینات اتاق '+rm+' هنوز ثبت نشده است.');
        var LK={sheet:S.sheet,key:S.key,rec:rec,chassis:ch,room:rm,engine:(ce&&ce.engine)||rec.engine||I3.engine||'',engineVerified:!!(ce&&ce.engine),fuel:(ce&&ce.fuel)||'',warn:w};
        var e3=digits(val('c_lk_eng')),fu3=val('c_lk_fuel');
        if(!w.length&&(!LK.engineVerified||e3.length===3)&&(!LK.fuel||fu3)){
          var le3=linkCheck(LK,e3,fu3);
          if(le3){S.formErr=le3;render();return}
          S.formErr='';var lid=docId(S.sheet,S.key);
          save(function(){return store.set('inspections',lid,rec)},'برگه باز شد');return;
        }
        S.linkConfirm=LK;S.linkErr='';S.formErr='';render();return;
      }
    }
    if(PSHEETS.indexOf(S.sheet)<0&&!rec.product){var pp0=carProd(S.key);if(pp0)rec.product=pp0}
    S.formErr='';
    var isCh=S.sheet==='chassis'&&!tmc,uid3=docId(S.sheet,S.key);
    save(function(){return store.set('inspections',uid3,rec)},isCh?'برگه باز شد · '+fuelTxt(rec.fuel):'برگه باز شد').then(function(ok){
      if(ok&&isCh){S.undo={id:uid3,until:Date.now()+6000,fuel:rec.fuel};setTimeout(render,6200);render()}
    });
    });
  }else if(f==='corrfuel'){
    var dq2=insp(S.sheet,S.key),Iq2=identity(S.key),chq=carRecords(S.key).recs.filter(function(x){return x.sheet==='chassis'&&x.fuel})[0],nf=val('cf_fuel'),rf=val('cf_reason'),ef='';
    if(!chq)ef='برگه شاسی با نوع سوخت پیدا نشد.';else if(nf!=='single'&&nf!=='dual')ef='نوع سوخت درست را انتخاب کنید.';else if(nf===chq.fuel)ef='نوع سوخت انتخابی با ثبت فعلی یکی است.';else if(rf.length<3)ef='دلیل اصلاح را بنویسید.';

    }else save(function(){return store.set('users',rfid,rf2)},'درخواست اصلاح سوخت ارسال شد').then(function(ok){if(ok){S.corrOpen='';S.corrErr=''}render()});

      save(function(){return store.set('users',rid,rr).then(function(){return corrApply(Object.assign({id:rid},rr))})},'شماره اصلاح شد').then(function(ok){if(ok){S.corrOpen='';S.corrErr=''}if(ok&&S.key===oq&&SHEETS[S.sheet].keyKind===fq){S.key=nq}render()});
    }else save(function(){return store.set('users',rid,rr)},'درخواست اصلاح ارسال شد').then(function(ok){if(ok){S.corrOpen='';S.corrErr=''}render()});
  }else if(f==='ids'){
    var dI=insp(S.sheet,S.key);if(dI&&dI.final){toast('شماره‌ها بعد از تأیید نهایی قفل است؛ درخواست اصلاح بدهید.');return}

  }else if(f==='short'){
    var dd2=insp(S.sheet,S.key),have2={};
    Object.keys((dd2&&dd2.items)||{}).forEach(function(id){var it=dd2.items[id];if(it.r==='shortage'&&!it.closedAt)have2[(it.part||it.note||'').trim()]=1});

render();
connect();
