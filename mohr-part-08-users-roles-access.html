<script type="text/x-mohr-section" data-mohr-section="features/roles" data-order="29">

      // BEGIN SECTION: features/roles
              /* ---------- نقش‌ها و دسترسی‌ها (مدیر می‌سازد؛ حساب نقش دلخواه role="cr:<id>" دارد) ---------- */
              var ROLE_PERMS = [
                ['dash', 'داشبورد'],
                ['short', 'کسری‌های باز'],
                ['smp', 'نمونه‌زنی'],
                ['report', 'گزارش'],
                ['car', 'پرونده خودرو'],
                ['cpf', 'فرم حفاظت از مشتری'],
              ];
              var AREAS = {
                all: { label: 'همه‌ی حوزه‌ها', sheets: null },
                chassis: { label: 'شاسی و موتور', sheets: ['chassis', 'engine'] },
                trim: { label: 'تزیینات', sheets: ['trim'] },
                gas: { label: 'تست گاز', sheets: ['gas'] },
                final: { label: 'نهایی (بالا و پایین)', sheets: ['final1', 'final2'] },
                mech: { label: 'مکانیکی', sheets: ['mech', 'mech2'] },
                roll: { label: 'رول تست', sheets: ['roll'] },
                road: { label: 'تست جاده', sheets: ['road'] },
                comm: { label: 'تجاری', sheets: ['comm'] },
              };
              var ROLE_DEFAULTS = [
                {
                  id: 'sup_chassis',
                  name: 'سرپرست شاسی و موتور',
                  scope: 'chassis',
                  tabs: { dash: true, cpf: true },
                },
                {
                  id: 'sup_final',
                  name: 'سرپرست نهایی',
                  scope: 'final',
                  tabs: { dash: true, cpf: true },
                },
                {
                  id: 'sup_trim',
                  name: 'سرپرست تزیینات',
                  scope: 'trim',
                  tabs: { dash: true, cpf: true },
                },
              ];
              function roleDefs() {
                var r = S.lists && S.lists.roles;
                return Array.isArray(r) ? r : ROLE_DEFAULTS;
              }
              function customRoleId(u) {
                var m = u && /^cr:(.+)$/.exec(u.role || '');
                return m ? m[1] : '';
              }
              function isCustomRole(u) {
                return !!customRoleId(u);
              }
              function roleDefOf(u) {
                var id = customRoleId(u);
                return id
                  ? roleDefs().filter(function (r) {
                      return r.id === id;
                    })[0] || null
                  : null;
              }
              function rolePerm(p) {
                var d = roleDefOf(S.user);
                return !!(d && d.tabs && d.tabs[p]);
              }
              /* حوزه‌ی مجاز کاربر: فهرست برگه‌ها، یا null یعنی همه */
              function userSheets() {
                var d = roleDefOf(S.user);
                return d && AREAS[d.scope] ? AREAS[d.scope].sheets : null;
              }
              function firstRoleTab() {
                var t = ROLE_PERMS.map(function (x) {
                  return x[0];
                }).filter(rolePerm);
                return t[0] || 'dash';
              }
              function customTabs() {
                var h = '<div class="tabs" role="tablist">';
                ROLE_PERMS.forEach(function (p) {
                  if (rolePerm(p[0]))
                    h += p[0] === 'short' ? shortTab() : p[0] === 'cpf' ? cpfTab() : tabBtn(p[0], p[1]);
                });
                return h + '</div>';
              }
              function roleEmptyView() {
                return '<div class="card"><p class="hint" style="margin:0">برای این نقش تبی فعال نشده است. با مدیر تماس بگیرید.</p></div>';
              }
              function roleSheetsTxt(u) {
                var d = roleDefOf(u);
                return d ? d.name : 'نقش حذف‌شده';
              }

              /* ---------- صفحه‌ی مدیریت نقش‌ها ---------- */
              function roleForm(r) {
                var tabs = ROLE_PERMS.map(function (p) {
                  return (
                    '<label class="chk"><input type="checkbox" id="rp_' +
                    r.id +
                    '_' +
                    p[0] +
                    '"' +
                    (r.tabs && r.tabs[p[0]] ? ' checked' : '') +
                    '> ' +
                    p[1] +
                    '</label>'
                  );
                }).join('');
                var scope = areaOptions(r.scope);
                var del =
                  S.roleDel === r.id
                    ? '<button type="button" class="btn sm danger" data-act="roledelyes" data-id="' +
                      esc(r.id) +
                      '">تأیید حذف</button><button type="button" class="btn sm" data-act="roledelno">انصراف</button>'
                    : '<button type="button" class="btn sm danger" data-act="roledelask" data-id="' +
                      esc(r.id) +
                      '">حذف نقش</button>';
                return (
                  '<form data-form="rolesave" data-id="' +
                  esc(r.id) +
                  '" class="mgform" style="border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:12px"><label class="f">نام نقش<input class="in" id="rn_' +
                  r.id +
                  '" value="' +
                  esc(r.name) +
                  '" maxlength="40"></label><label class="f">محدود به حوزه<select class="in" id="rs_' +
                  r.id +
                  '">' +
                  scope +
                  '</select></label><div class="row">' +
                  tabs +
                  '</div><div class="row"><button class="btn primary" type="submit">ذخیره</button>' +
                  del +
                  '</div></form>'
                );
              }
              function areaOptions(cur) {
                return Object.keys(AREAS)
                  .map(function (k) {
                    return (
                      '<option value="' +
                      k +
                      '"' +
                      (k === cur ? ' selected' : '') +
                      '>' +
                      esc(AREAS[k].label) +
                      '</option>'
                    );
                  })
                  .join('');
              }
              function restoreBtns() {
                return S.roleRestore
                  ? '<span class="hint">سه نقش آماده به حالت اولشان برمی‌گردند (نقش‌های دیگر دست نمی‌خورند).</span><button type="button" class="btn sm danger" data-act="rolerestoreyes">تأیید</button><button type="button" class="btn sm" data-act="rolerestoreno">انصراف</button>'
                  : '<button type="button" class="btn sm" data-act="rolerestoreask">برگرداندن سه نقش آماده</button>';
              }
              function rolesCards() {
                var add =
                  '<form data-form="roleadd" class="mgform"><label class="f">نقش تازه (مثلاً مدیر نقاشی)<input class="in" id="rnew" autocomplete="off" maxlength="40"></label><label class="f">حوزه<select class="in" id="rnew_sc">' +
                  areaOptions('all') +
                  '</select></label><button class="btn" type="submit">افزودن نقش</button></form><div class="row" style="margin-top:12px">' +
                  restoreBtns() +
                  '</div>';
                return mgCard(
                  'shield',
                  'نقش‌ها و دسترسی‌ها',
                  'برای هر نقش مشخص کنید کدام تب‌ها را ببیند و به کدام حوزه محدود باشد. حساب این نقش‌ها بازدید ثبت نمی‌کند و فقط تب‌های انتخاب‌شده را دارد. دسترسی فعلاً فقط در ظاهر برنامه اعمال می‌شود.',
                  roleDefs().map(roleForm).join('') + add,
                );
              }
              /* ذخیره‌ی کل فهرست نقش‌ها در سند فهرست‌ها */
              function rolesSave(next, what) {
                return lsSave(
                  function (c) {
                    c.roles = next;
                  },
                  what,
                  false,
                );
              }
              function roleFromForm(r) {
                var tabs = {};
                ROLE_PERMS.forEach(function (p) {
                  var e = document.getElementById('rp_' + r.id + '_' + p[0]);
                  if (e && e.checked) tabs[p[0]] = true;
                });
                return {
                  id: r.id,
                  name: val('rn_' + r.id),
                  scope: val('rs_' + r.id) || 'all',
                  tabs: tabs,
                };
              }
              function roleSaveForm(id) {
                var cur = roleDefs(),
                  r = cur.filter(function (x) {
                    return x.id === id;
                  })[0];
                if (!r) return;
                var nr = roleFromForm(r);
                if (!nr.name) {
                  toast('نام نقش را بنویسید.');
                  return;
                }
                rolesSave(
                  cur.map(function (x) {
                    return x.id === id ? nr : x;
                  }),

                );
              }
              function roleAddForm() {
                var name = val('rnew');
                if (!name) {
                  toast('نام نقش را بنویسید.');
                  return;
                }
                rolesSave(
                  roleDefs().concat([
                    {
                      id: 'r' + Date.now().toString(36),
                      name: name,
                      scope: val('rnew_sc') || 'all',
                      tabs: { dash: true, cpf: true },
                    },
                  ]),
                  'افزودن نقش ' + name,
                );
              }
              /* نقش‌های آماده با همان شناسه جایگزین می‌شوند یا اگر نیستند اضافه می‌شوند */
              function rolesRestore() {
                S.roleRestore = false;
                var cur = roleDefs().map(function (r) {
                  var d = ROLE_DEFAULTS.filter(function (x) {
                    return x.id === r.id;
                  })[0];
                  return d || r;
                });
                ROLE_DEFAULTS.forEach(function (d) {
                  if (
                    !cur.some(function (r) {
                      return r.id === d.id;
                    })
                  )
                    cur.push(d);
                });
                rolesSave(cur, 'برگرداندن نقش‌های آماده');
              }
              function roleDelete(id) {
                var r = roleDefs().filter(function (x) {
                  return x.id === id;
                })[0];
                S.roleDel = '';
                rolesSave(
                  roleDefs().filter(function (x) {
                    return x.id !== id;
                  }),
                  'حذف نقش ' + (r ? r.name : ''),
                );
              }

</script>

<script type="text/x-mohr-section" data-mohr-section="actions/forms/owned-submitAddUser" data-order="43.22857142857143">

              function submitAddUser() {
                var uc = digits(val('uc')),
                  un = val('un'),
                  up = digits(val('up')),
                  mgr = S.ukind === 'mgr',
                  cust = S.ukind === 'role';
                var us = mgr || cust ? 'planning' : val('us'),
                  extra = mgr ? { mgrTitle: val('ut'), mgrUnit: val('uu') } : {};
                if (!/^[A-Za-z0-9]+$/.test(uc)) {
                  S.formErr = 'کد پرسنلی را (فقط حرف لاتین و عدد) وارد کنید.';
                  render();
                  return;
                }
                if (!un) {
                  S.formErr = 'نام را بنویسید.';
                  render();
                  return;
                }
                if (up.length < 4) {
                  S.formErr = 'رمز دست‌کم ۴ کاراکتر باشد.';
                  render();
                  return;
                }
                if (mgr && !extra.mgrTitle) {
                  S.formErr = 'سمت را انتخاب کنید.';
                  render();
                  return;
                }
                if (cust && !val('ur2')) {
                  S.formErr = 'نقش را انتخاب کنید.';
                  render();
                  return;
                }
                var ur = mgr ? 'mgr' : cust ? 'cr:' + val('ur2') : '';
                S.formErr = '';
                if (srvAdmin()) {
                  save(function () {
                    return adminCall('adduser', {
                      users: [
                        Object.assign({ id: uc, name: un, station: us, role: ur, password: up }, extra),
                      ],
                    });
                  }, 'کاربر ذخیره شد').then(function (ok) {
                    if (ok)
                      ['uc', 'un', 'up'].forEach(function (i) {
                        var e = document.getElementById(i);
                        if (e) e.value = '';
                      });
                  });
                  return;
                }
                var salt = uid();
                sha(salt + up)
                  .then(function (hh) {
                    return save(function () {
                      return store.set(
                        'users',
                        uc,
                        Object.assign(
                          { name: un, station: us, role: ur, salt: salt, hash: hh, createdAt: nowIso() },
                          extra,
                        ),
                      );
                    }, 'کاربر ذخیره شد');
                  })
                  .then(function () {
                    ['uc', 'un', 'up'].forEach(function (i) {
                      var e = document.getElementById(i);
                      if (e) e.value = '';
                    });
                  });
              }
              function submitBulkUsers() {
                var ok = [],
                  bad = [],
                  seenC = {};
                var addU = function (c, n, stn, pw, label) {
                  c = digits(c);
                  pw = digits(pw);
                  n = String(n || '').trim();
                  if (/^[A-Za-z0-9]+$/.test(c) && n && stn && pw && pw.length >= 4 && !seenC[c]) {
                    seenC[c] = 1;
                    ok.push({ c: c, n: n, st: stn, pw: pw });
                  } else bad.push(label);
                };
                var byName = {};
                Object.keys(STATION_NAME).forEach(function (k) {
                  if (k !== 'owner') {
                    byName[STATION_NAME[k]] = k;
                    byName[k] = k;
                  }
                });
                byName['شاسی'] = 'chassis';
                byName[STATION_NAME.engine] = 'chassis';
                byName.engine = 'chassis';
                Array.prototype.forEach.call(
                  document.querySelectorAll('#bulkrows .brow'),
                  function (rw, i) {
                    var g = function (k) {
                      var e = rw.querySelector('[data-bf=' + k + ']');
                      return e ? e.value : '';
                    };
                    if (!g('c').trim() && !g('n').trim() && !g('p').trim()) return;
                    addU(g('c'), g('n'), g('s'), g('p'), 'ردیف ' + fa(i + 1));
                  },
                );
                val('bulk')
                  .split(/\n+/)
                  .map(function (x) {
                    return x.trim();
                  })
                  .filter(Boolean)
                  .forEach(function (ln, i) {
                    var p = ln.split(/[,\t;،]/).map(function (x) {
                      return x.trim();
                    });
                    addU(p[0], p[1], byName[p[2]], p[3], 'خط چسبانده ' + fa(i + 1));
                  });
                if (!ok.length && !bad.length) {
                  S.bulkMsg = 'هیچ ردیفی پر نشده است.';
                  render();
                  return;
                }
                if (srvAdmin()) {
                  adminCall('adduser', {
                    users: ok.map(function (u) {
                      return { id: u.c, name: u.n, station: u.st, password: u.pw };
                    }),
                  })
                    .then(function () {
                      S.bulkMsg =
                        fa(ok.length) +
                        ' کاربر ذخیره شد.' +
                        (bad.length
                          ? ' ردشده (کد، نام، ایستگاه یا رمز درست نیست یا کد تکراری است): ' +
                            bad.join('، ')
                          : '');
                      render();
                    })
                    .catch(function (e) {
                      S.bulkMsg = 'ذخیره نشد. ' + ((e && e.message) || '');
                      render();
                    });
                  return;
                }
                Promise.all(
                  ok.map(function (u) {
                    var salt = uid();
                    return sha(salt + u.pw).then(function (hh) {
                      return store.set('users', u.c, {
                        name: u.n,
                        station: u.st,
                        salt: salt,
                        hash: hh,
                        createdAt: nowIso(),
                      });
                    });
                  }),
                )
                  .then(function () {
                    S.bulkMsg =
                      fa(ok.length) +
                      ' کاربر ذخیره شد.' +
                      (bad.length
                        ? ' ردشده (کد، نام، ایستگاه یا رمز درست نیست یا کد تکراری است): ' + bad.join('، ')
                        : '');
                    render();
                  })
                  .catch(function (e) {
                    S.bulkMsg = 'ذخیره نشد. ' + ((e && e.message) || '');
                    render();
                  });
              }
</script>
