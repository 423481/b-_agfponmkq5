<script type="text/x-mohr-section" data-mohr-section="views/wizard/shortScope" data-order="19.929577464788732">

      // BEGIN SECTION: views/wizard/shortScope


              function shortScope(d) {

                if (!S.user) return false;

                var st = S.user.station;

                if (S.user.id === 'owner' || st === 'commercial' || st === 'planning') return true;

                return SHEETS[d.sheet].station === st;

              }
      // END SECTION: views/wizard/shortScope
    
</script>

<script type="text/x-mohr-section" data-mohr-section="views/wizard/shortGroups" data-order="19.943661971830984">

      // BEGIN SECTION: views/wizard/shortGroups


              function shortGroups() {

                var g = {},

                  qs = null;

                if (S.shQ) {

                  qs = {};

                  carRecords(S.shQ).recs.forEach(function (r) {

                    qs[r.id] = 1;

                  });

                }

                S.data.insp.forEach(function (d) {

                  if (!SHEETS[d.sheet] || !shortScope(d)) return;

                  if (qs && !qs[d.id]) return;

                  Object.keys(d.items || {}).forEach(function (id) {

                    var it = d.items[id];

                    if (it.r === 'shortage' && !it.closedAt) {

                      var p = (it.part || it.note || '—').trim();

                      (g[p] = g[p] || []).push({ d: d, id: id, it: it });

                    }

                  });

                });

                return Object.keys(g)

                  .map(function (p) {

                    return {

                      p: p,

                      list: g[p].sort(function (a, b) {

                        return (a.it.at || '') < (b.it.at || '') ? -1 : 1;

                      }),

                    };

                  })

                  .sort(function (a, b) {

                    return b.list.length - a.list.length;

                  });

              }
      // END SECTION: views/wizard/shortGroups
    
</script>

<script type="text/x-mohr-section" data-mohr-section="views/wizard/shortOpenCount" data-order="19.95774647887324">

              }
      // END SECTION: views/wizard/shortOpenCount
    
</script>

<script type="text/x-mohr-section" data-mohr-section="features/planning/owned-openPsh" data-order="32.07692307692308">

                    var p = pshSplit(it),
                      hide = q && norm(it).indexOf(q) < 0;
                    return (
                      '<label class="pshrow" data-q="' +
                      esc(it) +
                      '"' +
                      (hide ? ' style="display:none"' : '') +
                      '><input type="checkbox" data-act="pssel" data-v="' +
                      esc(it) +
                      '"' +
                      (sel[it] ? ' checked' : '') +
                      '><span class="num ltr">' +
                      esc(p.code) +
                      '</span><span class="grow">' +
                      esc(p.text) +
                      '<small class="hint" style="display:block">' +
                      esc(pshStLabel(p.st) || 'ایستگاه مشخص نشده') +
                      '</small></span></label>'
                    );
                  })
                  .join('');
              }
              function pshFilterDom(v) {

                  function (e) {
                    e.style.display = !q || e.getAttribute('data-k').indexOf(q) >= 0 ? '' : 'none';
                  },
                );
              }
              function pshSelCount() {
                return Object.keys(S.psSel || {}).length;
              }
              function pshAddCard() {
                return (
                  '<div class="card"><h2>ثبت کسری برای یک خودرو</h2><form data-form="pshadd" class="mgform">' +
                  '<div class="row"><label class="f grow">سریال، شاسی، موتور یا اتاق<input class="in num ltr" id="ps_key" inputmode="numeric" autocomplete="off"></label><button type="button" class="btn" data-act="livescan" data-scan="ps_key" style="align-self:flex-end">اسکن بارکد</button></div>' +
                  '<label class="f">جستجو در فهرست (کد یا نام قطعه)<input class="in" id="psq" autocomplete="off" value="' +
                  esc(S.psQ || '') +
                  '"></label>' +
                  '<div id="pshlist" class="pshlist">' +
                  pshPicker() +
                  '</div>' +
                  '<button class="btn primary" type="submit">ثبت <span id="pshn">' +
                  fa(pshSelCount()) +
                  '</span> کسری</button></form></div>'
                );
              }
              function pshAdd() {
                var typed = digits(val('ps_key')),
                  sel = Object.keys(S.psSel || {});

                  toast('شماره‌ی خودرو را بنویسید');
                  return;
                }
                if (!sel.length) {
                  toast('حداقل یک کسری را انتخاب کنید');
                  return;
                }
                var car = carRecords(typed).key,
                  have = {};
                openPsh().forEach(function (x) {

                });

                  docs = [];

                    docs.push({
                      kind: 'pshort',
                      key: typed,
                      car: car,
                      code: p.code,
                      text: p.text,
                      st: p.st,
                      by: S.user.name,
                      byId: S.user.id,
                      at: now,
                      closedAt: '',

                    });
                });
                if (!docs.length) {
                  toast('این کسری‌ها برای این خودرو از قبل باز هستند');
                  return;
                }
                S.psSel = {};
                S.psQ = '';
                var k = document.getElementById('ps_key');
                if (k) k.value = '';
                save(
                  function () {
                    return Promise.all(
                      docs.map(function (d) {

                  fa(docs.length) + ' کسری ثبت شد',

              }
              function pshClose(id) {
                var x = (S.pshorts || []).filter(function (r) {
                  return r.id === id;

                save(function () {
                  return store.update('users', id, {
                    closedAt: nowIso(),

                    closedById: S.user.id,
                  });
                }, 'کسری رفع شد');
              }
              /* رفع: برنامه‌ریزی، تجاری، مدیر و چکمن ایستگاه مسئولِ همان کسری */

                if (!pshCanClose(x)) return '';
                return (
                  '<div class="row" style="margin-top:8px"><button class="btn sm primary" data-act="pshclose" data-id="' +
                  esc(x.id) +
                  '">رفع شد</button>' +
                  (canPlanShort()
                    ? '<button class="btn sm" data-act="pshdelask" data-id="' +
                      esc(x.id) +
                      '">حذف</button>'
                    : '') +
                  '</div>'
                );
              }
              function pshRow(x) {
                return (
                  '<div class="it' +
                  (x.closedAt ? '' : ' ng') +
                  '"><div class="row"><b class="grow"><span class="num ltr">' +
                  esc(x.code) +
                  '</span> ' +
                  esc(x.text) +
                  '</b><span class="chip ' +
                  (x.closedAt ? 'closed' : 'shortage') +
                  '">' +
                  (x.closedAt ? 'رفع شد' : 'کسری') +
                  '</span></div>' +
                  '<div class="m">ایستگاه مسئول: ' +
                  esc(pshStLabel(x.st) || 'مشخص نشده') +
                  '</div>' +
                  '<div class="m">' +
                  whoWhen(x.by, x.at, 'ثبت‌کننده') +
                  '</div>' +
                  (x.closedAt
                    ? '<div class="m">' + whoWhen(x.closedBy, x.closedAt, 'رفع‌کننده') + '</div>'
                    : '') +
                  pshRowActions(x) +
                  '</div>'
                );
              }
              function pshByCar(list) {
                var g = {},
                  order = [];
                list.forEach(function (x) {
                  if (!g[x.car]) {
                    g[x.car] = [];
                    order.push(x.car);
                  }
                  g[x.car].push(x);
                });
                return order.map(function (k) {
                  return {
                    car: k,
                    list: g[k].sort(function (a, b) {
                      return (a.at || '') < (b.at || '') ? -1 : 1;
                    }),
                  };
                });
              }
              function pshOpenCard() {
                var open = openPsh(),
                  gs = pshByCar(open).slice(0, 60);
                var h = '<div class="card"><h2>کسری‌های باز برنامه‌ریزی (' + fa(open.length) + ')</h2>';
                if (!open.length) return h + '<p class="hint" style="margin:0">کسری بازی نیست.</p></div>';
                h +=
                  '<label class="f">پیدا کردن خودرو<input class="in num ltr" id="psf" inputmode="numeric" autocomplete="off"></label><div id="pshopen">';

                    '<div data-k="' +
                    esc(g.car) +

                    esc(g.car) +
                    '</b> <span class="chip open">' +
                    fa(g.list.length) +
                    ' کسری</span></h3>' +

              }
              function pshDoneCard() {

                    .map(function (x) {

              function pshView() {

                if (a === 'pssel') {
                  var v = el.getAttribute('data-v');
                  S.psSel = S.psSel || {};
                  if (el.checked) S.psSel[v] = 1;
                  else delete S.psSel[v];
                  var n = document.getElementById('pshn');
                  if (n) n.textContent = fa(pshSelCount());

                }
                if (a === 'pshclose') {
                  var px = (S.pshorts || []).filter(function (r) {
                    return r.id === id;
                  })[0];

                }

                }

                }

<script type="text/x-mohr-section" data-mohr-section="actions/helpers/owned-closeShortageGroup" data-order="40.53333333333333">

              function closeShortageGroup(el) {
                var ix = +el.getAttribute('data-i'),
                  g2 = shortGroups()[ix];
                if (!g2) return;
                var note2 = val('sgn_' + ix);
                if (!note2) {
                  toast('اقدام انجام‌شده را بنویسید.');
                  return;
                }
                var sl = g2.list.filter(function (x) {
                  return (S.shChk || {})[x.d.id + '|' + x.id];
                });
                if (!sl.length) {
                  toast('هیچ خودرویی انتخاب نشده است.');
                  return;
                }
                var byDoc = {},
                  t5 = nowIso();
                sl.forEach(function (x) {
                  (byDoc[x.d.id] = byDoc[x.d.id] || {})[x.id] = {
                    closedAt: t5,
                    closedBy: S.user.name,
                    closedById: S.user.id,
                    closeNote: note2,
                  };
                  delete S.shChk[x.d.id + '|' + x.id];
                });
                save(
