              function listsUnchanged(base) {

              function makeRecoveryCode(id) {

                    function (j) {

                      render();
                    },
                    function (e) {
                      toast('ساخته نشد. ' + e.message);
                    },
                  );
                  return;
                }
                sha(rs + code).then(function (hh) {
                  return save(function () {
                    return store.update('users', id, {
                      rc: { salt: rs, h: hh, until: Date.now() + 1800000, by: S.user.name, tries: 0 },
                    });

                    if (ok) {

                if (a === 'tcnew') {
                  S.tcar = Object.assign(newTestCar(), {
                    fuel: (S.tcar || {}).fuel || 'dual',

                  });

                  render();

                }
                if (a === 'tcfuel') {

                  render();

                if (a === 'tcopen') {
                  var sh0 = S.sheet;

                  var c0 = S.tcar,
                    tk = SHEETS[sh0].keyKind,
                    k0 =
                      tk === 'serial'

                        : tk === 'chassis'
                          ? c0.chassis
                          : tk === 'engine'
                            ? c0.engine
                            : c0.room;
                  var rs = [];
                  if (!insp(sh0, k0) && !(sh0 === 'gas' && c0.fuel === 'single')) rs.push(tcRec(sh0));
                  if (sh0 === 'chassis' && !insp('engine', c0.engine)) rs.push(tcRec('engine'));
                  if (c0.fuel === 'single' && sh0 !== 'chassis' && !insp('chassis', c0.chassis))
                    rs.push(tcRec('chassis'));
                  save(function () {

                      }),

                if (a === 'tcdelask') {

                  render();
                  return;
                }
                if (a === 'tcdelno') {
                  S.tcDel = false;
                  render();
                  return;
                }
                if (a === 'tcdelyes') {
                  S.tcDel = false;
                  var dl2 = S.data.insp
                    .filter(function (x) {
                      return x.test;
                    })
                    .map(function (x) {

              function submitOwnerPassword() {
                var op = (document.getElementById('opw') || {}).value || '';

                  adminCall('owner_setup', { password: op }).then(
                    function (j) {
                      authSet(j.token, j.exp);
                      enterOwner();
                    },
                    function (e) {
                      S.ownerErr =
                        e.msg === 'exists' ? 'مدیر قبلاً تعریف شده است.' : 'ذخیره نشد. ' + e.message;
                      render();

                  );
                  return;

                var sl = uid();

                  .then(function (hh) {
                    return store.set('users', '__owner', {

                  );
                  return;

                var ns2 = uid();

              function submitForgot() {
                var fc = digits(val('fc')),
                  fr = digits(val('fr')),
                  f1 = digits(val('fp1')),
                  f2 = digits(val('fp2')),
                  fu = S.data.users.filter(function (x) {
                    return x.id === fc;
                  })[0],
                  bad = 'کد پرسنلی یا کد بازیابی درست نیست یا منقضی شده است.';
                if (f1.length < 4) {
                  S.loginErr = 'رمز جدید دست‌کم ۴ کاراکتر باشد.';
                  render();
                  return;
                }
                if (f1 !== f2) {
                  S.loginErr = 'تکرار رمز با رمز جدید یکی نیست.';
                  render();
                  return;
                }
                if (srvAdmin()) {
                  adminCall('rc_use', { id: fc, code: fr, password: f1 }).then(
                    function () {
                      S.forgot = false;
                      S.loginErr = '';
                      toast('رمز جدید ذخیره شد؛ با آن وارد شوید.');
                      render();
                    },
                    function (e) {
                      S.loginErr =
                        e.msg === 'bad_code' || e.status === 401 ? bad : 'ذخیره نشد. ' + e.message;
                      render();
                    },
                  );
                  return;
                }
                if (!fu || !fu.rc || !fu.rc.h || Date.now() > fu.rc.until || (fu.rc.tries || 0) >= 5) {
                  S.loginErr = bad;
                  render();
                  return;
                }
                sha(fu.rc.salt + fr).then(function (hr) {
                  if (hr !== fu.rc.h) {
                    S.loginErr = bad;

                    render();
                    return;
                  }
                  var ns3 = uid();
                  return sha(ns3 + f1)

                      return store.update('users', fu.id, {

                        hash: h3,
                        pwChangedAt: nowIso(),
                        rc: null,
                      });
                    })
                    .then(function () {
                      S.forgot = false;
                      S.loginErr = '';
                      toast('رمز جدید ذخیره شد؛ با آن وارد شوید.');
                      render();
                    });
                });

                if (p1.length < 4) {
                  S.pwErr = 'رمز جدید دست‌کم ۴ کاراکتر باشد.';

                if (p1 !== p2) {

                  return;
                }
                if (p1 === p0) {

                }
                if (srvAdmin()) {

                    },
                    function (e) {
                      S.pwErr =

                            : 'ذخیره نشد. ' + e.message;
                      render();
                    },
                  );
                  return;
                }
                sha(uu.salt + p0).then(function (h0) {
                  if (h0 !== uu.hash) {
                    S.pwErr = 'رمز فعلی درست نیست.';
                    render();
                    return;
                  }
                  var ns = uid();
                  return sha(ns + p1).then(function (h1) {
                    return save(function () {
                      return store.update('users', uu.id, { salt: ns, hash: h1, pwChangedAt: nowIso() });
                    }, 'رمز شما تغییر کرد').then(function (ok) {
                      if (ok) {
                        S.pwOpen = false;
                        S.pwErr = '';
                        render();
                      }
                    });
                  });
                });

              }
