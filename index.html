<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
</head>
<title>ثبت عیوب چکمن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>
/* Layout: tablet-first, RTL. Login -> pick sheet number -> one card per form section (EWT1, EWT2) with a row per printed box, each answered سالم / ایراد / قطعه نمونه, then a round stamp for the checkman's sign-off. */
:root{
  --bg:#ECEFF4; --surface:#FFFFFF; --surface-2:#F4F6FA; --line:#D5DBE5;
  --ink:#16213A; --muted:#434E68;
  --stamp:#2A44B0; --stamp-soft:#E3E8FA;
  --open:#B93A0C; --open-soft:#FBE7DE;
  --wait:#8A5A00; --wait-soft:#FCEFD0;
  --ok:#17744A; --ok-soft:#DDF1E6;
  --on-stamp:#FFFFFF;
  --font:'Vazirmatn','Tahoma','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1320; --surface:#161D2F; --surface-2:#1C2540; --line:#2B3555;
  --ink:#E7EBF5; --muted:#B4BEDA;
  --stamp:#93A8FF; --stamp-soft:#222C57;
  --open:#FF9A73; --open-soft:#3A1F17;
  --wait:#F2C46B; --wait-soft:#38290C;
  --ok:#6FD3A0; --ok-soft:#12301F;
  --on-stamp:#0E1320;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1320; --surface:#161D2F; --surface-2:#1C2540; --line:#2B3555;
  --ink:#E7EBF5; --muted:#B4BEDA;
  --stamp:#93A8FF; --stamp-soft:#222C57;
  --open:#FF9A73; --open-soft:#3A1F17;
  --wait:#F2C46B; --wait-soft:#38290C;
  --ok:#6FD3A0; --ok-soft:#12301F;
  --on-stamp:#0E1320;
  color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.7;padding-inline:16px;padding-block:16px 40px;direction:rtl;font-weight:500}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1000px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums;letter-spacing:.02em}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{font-size:20px;font-weight:900;margin:0;text-wrap:balance}
.proto{font-size:12px;font-weight:700;color:var(--wait);background:var(--wait-soft);padding:2px 10px;border-radius:99px;white-space:nowrap}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who .nm{font-weight:700}
.who small{color:var(--muted)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.sync.local i{background:var(--wait)}

.btn{min-height:48px;padding:0 20px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--stamp);border-color:var(--stamp);color:var(--on-stamp)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--on-stamp)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}

.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{min-height:44px;padding:0 18px;border-radius:99px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:500;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.tab .cnt{margin-inline-start:6px;font-size:12px;background:var(--open-soft);color:var(--open);border-radius:99px;padding:0 8px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h2{font-size:17px;font-weight:900;margin:0 0 12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
label.f.grow{flex:1 1 240px;min-width:200px}
.in.num{font-size:20px;font-weight:700;letter-spacing:.06em}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sugg .pick{min-height:38px;padding:0 12px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pick{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface-2);cursor:pointer;font-weight:500;color:var(--ink)}
.pick[aria-pressed="true"]{background:var(--wait-soft);border-color:var(--wait);color:var(--wait);font-weight:700}
.bars{width:100%;height:auto;direction:ltr}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.in{min-height:48px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);width:100%;font-weight:700}
textarea.in{min-height:80px;resize:vertical}
.ltr{direction:ltr;text-align:right}
.hint{color:var(--muted);font-size:13px;margin:0;font-weight:600}
.formfoot{text-align:center;font-weight:900;font-size:16px;color:var(--ink);padding:12px 0 4px;margin-top:4px;border-top:2px solid var(--ink)}
.err{color:var(--open);font-size:13px;font-weight:700;margin:6px 0 0}

.login{max-width:560px;margin-inline:auto;width:100%}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-block:8px 16px}
.pick button{text-align:start;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);cursor:pointer;min-height:56px}
.pick button b{display:block}
.pick button small{color:var(--muted)}
.pick button[aria-pressed="true"]{border-color:var(--stamp);background:var(--stamp-soft)}

.kvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px 20px}
.kv small{display:block;color:var(--muted);font-size:12px;font-weight:700}
.kv b{font-size:18px;font-weight:900}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:12px;font-weight:700}
.bar.blocked{background:var(--open-soft);color:var(--open)}
.bar.wait{background:var(--wait-soft);color:var(--wait)}
.bar.ready{background:var(--ok-soft);color:var(--ok)}
.bar .big{font-size:17px;font-weight:900}

/* checklist */
.sechead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sechead h2{margin:0}
.prog{font-size:13px;color:var(--muted);font-weight:700}
.meter{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-bottom:12px}
.meter i{display:block;height:100%;background:var(--stamp)}
.items{display:flex;flex-direction:column}
.it{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it .top2{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.it .lb{font-weight:700;min-width:0;flex:1 1 240px}
.it.done{background:var(--ok-soft)}.it.done .lb{font-weight:700;color:var(--ok)}
.it.ng .lb,.it.sample .lb,.it.shortage .lb{font-weight:700}
.seg{display:flex;gap:6px}
.seg button{min-height:44px;min-width:76px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);cursor:pointer;font-weight:700;font-size:14px}
.seg button[aria-pressed="true"].k-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.seg button[aria-pressed="true"].k-ng{background:var(--open-soft);border-color:var(--open);color:var(--open)}
.seg button[aria-pressed="true"].k-short{background:var(--wait-soft);border-color:var(--wait);color:var(--wait)}
.seg button[aria-pressed="true"].k-sample{background:var(--wait-soft);border-color:var(--wait);color:var(--wait)}
.seg button[disabled]{opacity:.5;cursor:not-allowed}
.nt{border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.nt.ng{background:var(--open-soft)}
.nt.sample,.nt.shortage{background:var(--wait-soft)}
.nt.done{background:var(--ok-soft)}
.nt p{margin:0;font-weight:700}
.nt .m{font-size:12.5px;color:var(--muted)}
.chip{font-size:12px;font-weight:700;padding:1px 10px;border-radius:99px;white-space:nowrap;display:inline-block}
.chip.open{background:var(--open-soft);color:var(--open)}
.chip.sample,.chip.shortage{background:var(--wait-soft);color:var(--wait)}
.chip.closed{background:var(--ok-soft);color:var(--ok)}
.editbox{display:flex;flex-direction:column;gap:8px;background:var(--surface-2);padding:12px;border-radius:10px}

.signrow{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.stamp{width:116px;height:116px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.35;padding:10px;flex:none}
.stamp.done{border:3px double var(--stamp);color:var(--stamp);transform:rotate(-5deg);background:var(--stamp-soft)}
.stamp.done b{font-size:15px;font-weight:900}
.stamp.done span{font-size:11px;font-weight:700}
.stamp.done small{font-size:10px;opacity:.85}
.stamp.empty{border:2px dashed var(--line);color:var(--muted)}
.stamp.empty b{font-size:14px}
.stamp.empty small{font-size:11px}

.formhead{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:13px;font-weight:700;color:var(--muted);padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.formhead b{color:var(--ink)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
label.btn{display:inline-flex;align-items:center;justify-content:center}
.empty-note{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12.5px;color:var(--muted);font-weight:700}
tr.link{cursor:pointer}
tr.link:hover{background:var(--surface-2)}

.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin-inline:auto;max-width:440px;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;text-align:center;z-index:9}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translateY(10px);opacity:0}}}
</style>

<div class="wrap" id="app" aria-live="polite"></div>
<div id="toastbox"></div>
<input type="file" id="scancam" class="vh" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
<input type="file" id="scangal" class="vh" accept="image/*" tabindex="-1" aria-hidden="true">

function sha(t){
  if(window.crypto&&window.crypto.subtle&&window.TextEncoder){
    return window.crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2)}).join('')});
  }
  var h=5381;for(var i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;
  return Promise.resolve('f'+(h>>>0).toString(16));
}

function deepMerge(a,b){
  var o=Object.assign({},a);
  Object.keys(b).forEach(function(k){
    var v=b[k];
    o[k]=(v&&typeof v==='object'&&!Array.isArray(v)&&o[k]&&typeof o[k]==='object')?deepMerge(o[k],v):v;
  });
  return o;
}
function makeLocal(){

  var subs={};

  function list(c){return Object.keys(data[c]||{}).map(function(id){return Object.assign({id:id},data[c][id])})}
  function emit(c){(subs[c]||[]).forEach(function(f){f(list(c))})}
  return {mode:'local',
    set:function(c,id,d){(data[c]=data[c]||{})[id]=d;save();emit(c);return Promise.resolve()},
    update:function(c,id,d){(data[c]=data[c]||{})[id]=deepMerge(data[c][id]||{},d);save();emit(c);return Promise.resolve()},
    del:function(c,id){if(data[c])delete data[c][id];save();emit(c);return Promise.resolve()},
    sub:function(c,f){(subs[c]=subs[c]||[]).push(f);f(list(c))}};
}

function makeSupabase(){
  var cache={},subs={},timers={},busy={};
  function rows(c){var m=cache[c]||{};return Object.keys(m).map(function(id){return Object.assign({id:id},m[id].data)})}
  function emit(c){(subs[c]||[]).forEach(function(f){f(rows(c))})}
  function q(v){return '"'+String(v).replace(/"/g,'\\"')+'"'}
  function poll(c){
    if(busy[c])return;busy[c]=true;
    sbFetch(c+'?select=id,updated_at').then(function(meta){
      var m=cache[c]=cache[c]||{},seen={},need=[],changed=false;
      (meta||[]).forEach(function(r){seen[r.id]=1;if(!m[r.id]||m[r.id].at!==r.updated_at)need.push(r.id)});
      Object.keys(m).forEach(function(id){if(!seen[id]){delete m[id];changed=true}});
      if(!need.length){busy[c]=false;if(changed)emit(c);return}
      var parts=[];for(var i=0;i<need.length;i+=40)parts.push(need.slice(i,i+40));
      return Promise.all(parts.map(function(ids){return sbFetch(c+'?select=id,data,updated_at&id=in.('+ids.map(function(x){return encodeURIComponent(q(x))}).join(',')+')')})).then(function(res){
        res.forEach(function(arr){(arr||[]).forEach(function(r){m[r.id]={data:r.data||{},at:r.updated_at}})});
        busy[c]=false;emit(c);
      });
    }).catch(function(){busy[c]=false});
  }
  function put(c,id,d){
    return sbFetch(c+'?on_conflict=id',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify([{id:id,data:d}])}).then(function(){
      (cache[c]=cache[c]||{})[id]={data:d,at:'local-'+Date.now()};emit(c);setTimeout(function(){poll(c)},300);
    });
  }
  return {mode:'shared',supa:true,
    set:function(c,id,d){return put(c,id,d)},
    update:function(c,id,d){
      return sbFetch(c+'?select=data&id=eq.'+encodeURIComponent(id)).then(function(r){return put(c,id,deepMerge((r&&r[0]&&r[0].data)||{},d))});
    },
    del:function(c,id){return sbFetch(c+'?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:{Prefer:'return=minimal'}}).then(function(){if(cache[c])delete cache[c][id];emit(c)})},
    sub:function(c,f){
      (subs[c]=subs[c]||[]).push(f);poll(c);
      if(!timers[c])timers[c]=setInterval(function(){if(!document.hidden)poll(c)},4000);
    }};
}

    update:function(c,id,d){return db.doc(c+'/'+id).update(d)},
    del:function(c,id){return db.doc(c+'/'+id).delete()},
    sub:function(c,f){db.collection(c).onSnapshot(function(s){f(s.docs.map(function(d){return Object.assign({id:d.id},d.data())}))},function(){})}};
}

    if(done)return;done=true;store=st;S.mode=st.mode;S.supa=!!st.supa;if(st.mode==='local')S.isOwner=true;

    st.sub('archives',function(rows){S.data.arch=rows;render()});
    render();
  }
  probeSupa().then(function(sb){
    if(sb){use(sb);return}
    var p=(window.claude&&window.claude.use)?window.claude.use('db'):Promise.resolve(null);
    p.then(function(db){use(db?makeRemote(db):makeLocal())},function(){use(makeLocal())});
  });
  if(window.claude&&window.claude.use)window.claude.use('user').then(function(u){return u?u.isOwner():false}).then(function(o){S.isOwner=!!o||S.mode==='local';render()},function(){});
  setTimeout(function(){if(!done)use(makeLocal())},12000);
}

function stat(d){

  allDefItems(d.sheet).forEach(function(x){if(items[x.id]&&items[x.id].r)ans++});

function buildPdf(rep){

    rep.stages.map(function(s){return [s.name,s.page?fa(s.page)+' از '+fa(PAGES):'',s.status,s.by,s.at,String(s.open||0)]}),

    var b64=p.toDataURL('image/jpeg',0.9).split(',')[1],bin=atob(b64),u=new Uint8Array(bin.length);
    for(var k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);

    offs[po]=len;addS(po+' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 '+io+' 0 R >> >> /Contents '+co+' 0 R >>\nendobj\n');
    offs[co]=len;addS(co+' 0 obj\n<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream\nendobj\n');
    offs[io]=len;addS(io+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+PW+' /Height '+PH+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+u.length+' >>\nstream\n');add(u);addS('\nendstream\nendobj\n');

  return new Blob(chunks,{type:'application/pdf'});

/* ---------- barcode from a photo ---------- */
function decodePhoto(file){
  var url=URL.createObjectURL(file);
  function native(){
    if(!window.BarcodeDetector||!window.createImageBitmap)return Promise.reject(new Error('no native'));
    return createImageBitmap(file).then(function(bm){return new window.BarcodeDetector().detect(bm)}).then(function(r){if(r&&r.length&&r[0].rawValue)return r[0].rawValue;throw new Error('none')});
  }
  function zx(){
    if(!window.ZXing)return Promise.reject(new Error('no zxing'));
    var hints=new Map();hints.set(window.ZXing.DecodeHintType.TRY_HARDER,true);
    return new window.ZXing.BrowserMultiFormatReader(hints).decodeFromImageUrl(url).then(function(r){return r.getText()});
  }
  return native().catch(zx).then(function(t){URL.revokeObjectURL(url);return t},function(e){URL.revokeObjectURL(url);throw e});
}
function scanFile(f){
  (function(){
    if(!f)return;

    return;
  }
  if(f==='login'){
    var code=digits(val('ucode')),pw=digits(val('upw'));
    var u=S.data.users.filter(function(x){return x.id===code})[0];
    if(!u){S.loginErr='کد پرسنلی یا رمز درست نیست.';render();return}
    sha(u.salt+pw).then(function(hh){
      if(hh!==u.hash){S.loginErr='کد پرسنلی یا رمز درست نیست.';render();return}
      S.user={id:u.id,name:u.name,station:u.station};S.loginErr='';var ms=mySheets();S.sheet=ms[0]||'chassis';S.key='';S.tab=u.station==='commercial'?'car':'inspect';render();
    });
  }else if(f==='adduser'&&S.isOwner){
    var uc=digits(val('uc')),un=val('un'),us=val('us'),up=digits(val('up'));
    if(!/^[A-Za-z0-9]+$/.test(uc)){S.formErr='کد پرسنلی را (فقط حرف لاتین و عدد) وارد کنید.';render();return}
    if(!un){S.formErr='نام را بنویسید.';render();return}
    if(up.length<4){S.formErr='رمز دست‌کم ۴ کاراکتر باشد.';render();return}
    S.formErr='';var salt=uid();
    sha(salt+up).then(function(hh){return save(function(){return store.set('users',uc,{name:un,station:us,salt:salt,hash:hh,createdAt:nowIso()})},'کاربر ذخیره شد')}).then(function(){['uc','un','up'].forEach(function(i){var e=document.getElementById(i);if(e)e.value=''})});
  }else if(f==='bulkusers'&&S.isOwner){
    var lines=val('bulk').split(/\n+/).map(function(x){return x.trim()}).filter(Boolean),ok=[],bad=[];
    var byName={};Object.keys(STATION_NAME).forEach(function(k){if(k!=='owner'){byName[STATION_NAME[k]]=k;byName[k]=k}});
    lines.forEach(function(ln,i){
      var p=ln.split(/[,\t;،]/).map(function(x){return x.trim()});
      var c=digits(p[0]),n=p[1],st=byName[p[2]],pw=digits(p[3]);
      if(/^[A-Za-z0-9]+$/.test(c)&&n&&st&&pw&&pw.length>=4)ok.push({c:c,n:n,st:st,pw:pw});else bad.push(i+1);
    });
    Promise.all(ok.map(function(u){var salt=uid();return sha(salt+u.pw).then(function(hh){return store.set('users',u.c,{name:u.n,station:u.st,salt:salt,hash:hh,createdAt:nowIso()})})}))
      .then(function(){S.bulkMsg=fa(ok.length)+' کاربر ذخیره شد.'+(bad.length?' خط‌های ردشده (کد، نام، ایستگاه یا رمز درست نیست): '+bad.map(fa).join('، '):'');if(!bad.length){var e=document.getElementById('bulk');if(e)e.value=''}render()})
      .catch(function(e){S.bulkMsg='ذخیره نشد. '+((e&&e.message)||'');render()});
  }else if(f==='relink'&&S.isOwner){
    var rc=digits(val('rl_c')),rr=digits(val('rl_r'));
    if(!/^\d{7}$/.test(rc)||!/^\d{7}$/.test(rr)){toast('شماره شاسی و اتاق باید ۷ رقم باشد.');return}
    var kk2=S.key,tg=S.data.insp.filter(function(x){return SHEETS[x.sheet]&&SHEETS[x.sheet].keyKind==='serial'&&x.key===kk2});
    save(function(){return Promise.all(tg.map(function(x){return store.update('inspections',x.id,{chassisNo:rc,room:rr})}))},'اتصال در '+fa(tg.length)+' برگه اصلاح شد');
  }else if(f==='carsearch'){
    S.carq=digits(val('cq'));render();
  }else if(f==='search'){
    var k=digits(val('key'));
    if(!k){S.searchErr='شماره را وارد کنید.';render();return}
    if(!/^[A-Za-z0-9]+$/.test(k)){S.searchErr='شماره فقط حرف لاتین و عدد دارد.';render();return}
    S.key=resolveKey(S.sheet,k);S.searchErr='';S.formErr='';S.editing=null;render();
  }else if(f==='create'){
    var rec=Object.assign(idVals(S.sheet,'c_'),{sheet:S.sheet,key:S.key,createdBy:S.user.name,createdAt:nowIso(),formCode:FORM_CODE,formPage:SHEETS[S.sheet].page,items:{},signs:{}});
    var I3=identity(S.key);
    if(SHEETS[S.sheet].keyKind==='serial'){
      var needC=!(rec.chassisNo||I3.chassis),needR=!(rec.room||I3.room);
      if(needC||needR){S.formErr='این سریال هنوز به خودرو وصل نشده است. شماره شاسی و شماره اتاق را از روی برچسب شیشه وارد کنید تا به برگه‌های قبلی (شاسی، موتور، تزئینات) وصل شود.';render();return}
      var typed=!!(rec.chassisNo||rec.room);
      if(typed){
        if(rec.chassisNo&&!/^\d{7}$/.test(rec.chassisNo)){S.formErr='شماره شاسی باید ۷ رقم باشد (مثل ۰۸۶۵۷۴۲).';render();return}
        if(rec.room&&!/^\d{7}$/.test(rec.room)){S.formErr='شماره اتاق باید ۷ رقم باشد (مثل ۱۰۰۹۳۷۴).';render();return}
        var ch=rec.chassisNo||I3.chassis,rm=rec.room||I3.room,bad='';
        S.data.insp.forEach(function(x){var o=identOf(x);if(!o.serial||o.serial===S.key)return;
          if(ch&&o.chassis===ch)bad='شاسی '+ch+' قبلاً به سریال '+o.serial+' وصل شده است.';
          if(rm&&o.room===rm)bad='اتاق '+rm+' قبلاً به سریال '+o.serial+' وصل شده است.'});
        if(bad){S.formErr=bad+' اگر اشتباه ثبت شده، مالک باید اصلاح کند.';render();return}
        var ce=insp('chassis',ch),w=[];
        if(!ce)w.push('برگه شاسی '+ch+' هنوز ثبت نشده است.');
        if(!insp('trim',rm))w.push('برگه تزئینات اتاق '+rm+' هنوز ثبت نشده است.');
        S.linkConfirm={sheet:S.sheet,key:S.key,rec:rec,chassis:ch,room:rm,engine:rec.engine||(ce&&ce.engine)||I3.engine||'',warn:w};S.formErr='';render();return;
      }
    }
    save(function(){return store.set('inspections',docId(S.sheet,S.key),rec)},'برگه باز شد');
  }else if(f==='ids'){
    save(function(){return store.update('inspections',docId(S.sheet,S.key),idVals(S.sheet,'i_'))},'مشخصات ذخیره شد');
  }else if(f==='short'){
    var dd2=insp(S.sheet,S.key),have2={};
    Object.keys((dd2&&dd2.items)||{}).forEach(function(id){var it=dd2.items[id];if(it.r==='shortage'&&!it.closedAt)have2[(it.part||it.note||'').trim()]=1});
    var parts=Object.keys(S.shSel||{});
    val('sn').split(/[,،\n]+/).map(function(x){return x.trim()}).filter(Boolean).forEach(function(p){if(parts.indexOf(p)<0)parts.push(p)});
    parts=parts.filter(function(p){return !have2[p]});
    if(!parts.length){S.formErr2='دست‌کم یک قطعه انتخاب کنید یا بنویسید.';render();return}
    S.formErr2='';var m2={},t6=nowIso();
    parts.forEach(function(p,i3){m2['x'+uid()+i3]={r:'shortage',custom:true,part:p,note:p,by:S.user.name,byId:S.user.id,at:t6,closedAt:'',closedBy:''}});
    S.shSel={};
    writeItems(m2,fa(parts.length)+' کسری ثبت شد').then(function(){var e=document.getElementById('sn');if(e)e.value=''});
  }else if(f==='extra'){
    var n=val('xn'),ty=val('xt');
    if(!n){S.formErr='برای ثبت ایراد، شرح را بنویسید. اگر ایرادی نیست، از «تأیید نهایی بازدید» پایین صفحه استفاده کنید.';render();return}
    S.formErr='';var m={};m['x'+uid()]={r:ty,custom:true,note:n,by:S.user.name,byId:S.user.id,at:nowIso(),closedAt:'',closedBy:''};
    writeItems(m,'در پرونده ثبت شد').then(function(){var e=document.getElementById('xn');if(e)e.value=''});
  }
});

render();
connect();
})();
</script>
