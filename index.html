<meta name="theme-color" content="#1f3a8a">

<style>
/* Layout: tablet-first, RTL. Login -> pick sheet number -> one card per form section (EWT1, EWT2) with a row per printed box, each answered سالم / ایراد / قطعه نمونه, then a round stamp for the checkman's sign-off. */
:root{
  --bg:#ECEFF4; --surface:#FFFFFF; --surface-2:#F4F6FA; --line:#D5DBE5;
  --ink:#16213A; --muted:#434E68;
  --stamp:#2A44B0; --stamp-soft:#E3E8FA;
  --open:#B93A0C; --open-soft:#FBE7DE;
  --wait:#8A5A00; --wait-soft:#FCEFD0;
  --ok:#17744A; --ok-soft:#DDF1E6;
  --on-stamp:#FFFFFF;
  --font:'Vazirmatn','Tahoma','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1320; --surface:#161D2F; --surface-2:#1C2540; --line:#2B3555;
  --ink:#E7EBF5; --muted:#B4BEDA;
  --stamp:#93A8FF; --stamp-soft:#222C57;
  --open:#FF9A73; --open-soft:#3A1F17;
  --wait:#F2C46B; --wait-soft:#38290C;
  --ok:#6FD3A0; --ok-soft:#12301F;
  --on-stamp:#0E1320;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1320; --surface:#161D2F; --surface-2:#1C2540; --line:#2B3555;
  --ink:#E7EBF5; --muted:#B4BEDA;
  --stamp:#93A8FF; --stamp-soft:#222C57;
  --open:#FF9A73; --open-soft:#3A1F17;
  --wait:#F2C46B; --wait-soft:#38290C;
  --ok:#6FD3A0; --ok-soft:#12301F;
  --on-stamp:#0E1320;
  color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.7;padding-inline:16px;padding-block:16px 40px;direction:rtl;font-weight:500}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1000px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums;letter-spacing:.02em}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{font-size:20px;font-weight:900;margin:0;text-wrap:balance}
.proto{font-size:12px;font-weight:700;color:var(--wait);background:var(--wait-soft);padding:2px 10px;border-radius:99px;white-space:nowrap}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who .nm{font-weight:700}
.who small{color:var(--muted)}.top{gap:8px}.who{gap:6px}.who .btn.sm{min-height:36px;padding:0 10px}.who .whoin{flex:1 1 140px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.who .sync{font-size:12px}.who .pickgrp{display:flex;gap:6px;flex:1 1 100%}.who .pickgrp .btn{flex:1 1 0;white-space:nowrap}.who .pickgrp .btn[aria-pressed="true"]{background:var(--stamp);border-color:var(--stamp);color:#fff;font-weight:800}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.sync.local i{background:var(--wait)}

.btn{min-height:48px;padding:0 20px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--stamp);border-color:var(--stamp);color:var(--on-stamp)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--on-stamp)}
.btn.ok:hover{filter:brightness(1.08);background:var(--ok)}
.tbanner{background:var(--wait-soft);color:var(--wait);border:2px dashed var(--wait);border-radius:12px;padding:10px 14px;font-weight:700}
.tchip{display:inline-block;font-size:12px;font-weight:900;padding:1px 10px;border-radius:99px;background:var(--wait-soft);color:var(--wait);border:1.5px dashed var(--wait);white-space:nowrap}
.tcnum{display:flex;flex-wrap:wrap;gap:6px 18px;margin:8px 0}
.tcnum span{font-weight:700}.tcnum b{font-size:20px;letter-spacing:.08em}
.rcbox{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--ok-soft);color:var(--ok);font-weight:700}.rcbox .num{font-size:26px;letter-spacing:.12em}

    o[k]=(v&&typeof v==='object'&&!Array.isArray(v)&&o[k]&&typeof o[k]==='object')?deepMerge(o[k],v):v;

}

var KEEP_FIRST=['signs','items','final'];

  if(cur===undefined||cur===null)return add;
  var isObj=function(x){return x&&typeof x==='object'&&!Array.isArray(x)};
  if(!isObj(cur)||!isObj(add))return cur;
  var o=Object.assign({},cur);
  Object.keys(add).forEach(function(k){o[k]=fillDeep(cur[k],add[k])});
  return o;
}
function fillMerge(cur,d){

  Object.keys(d).forEach(function(k){(KEEP_FIRST.indexOf(k)>=0?keep:rest)[k]=d[k]});
  var o=deepMerge(cur,rest);
  Object.keys(keep).forEach(function(k){o[k]=fillDeep(cur[k],keep[k])});

}

function loginLocal(code,pw,rawPw,trusted,su){
  if(trusted&&su){if(su.id==='owner')enterOwner();else enterUser(su);return}
  if(isOwnerLogin(code)){(trusted?Promise.resolve(true):ownerPwOk(rawPw)).then(function(ok){if(!ok){S.loginErr='کد پرسنلی یا رمز درست نیست.';render();return}var needCode=!S.ownerRec.code;enterOwner();if(needCode)toast('کد پرسنلی مدیر را در کارت بالای این صفحه ثبت کنید')});return}
  var u=S.data.users.filter(function(x){return x.id===code})[0];
  if(!u){S.loginErr=trusted?'اطلاعات کاربران هنوز بارگیری نشده؛ چند ثانیه بعد دوباره امتحان کنید.':'کد پرسنلی یا رمز درست نیست.';render();return}
  var vf=u.hash?{salt:u.salt,hash:u.hash}:verGet(u.id);
  if(!vf){S.loginErr='برای اولین ورود روی این دستگاه باید اینترنت وصل باشد.';render();return}
  (trusted?Promise.resolve(vf.hash):sha(vf.salt+pw)).then(function(hh){
    if(hh!==vf.hash){S.loginErr='کد پرسنلی یا رمز درست نیست.';render();return}
    enterUser(u);
  });
}

function stepSec(d,edit){
  if(!edit||!d||d.final||!isChs(d.sheet))return null;
  var secs=secsOf(d.sheet,prodOf(d));
  for(var i=0;i<secs.length;i++){var sc=secs[i];if(sc.choice||(d.signs&&d.signs[sc.id])||!secOK(sc.id))continue;return sc}
  return null;

function stepAdvance(d,id){
  var sc=stepSec(d,true);if(!sc||String(id).indexOf(sc.id+'-')!==0)return;
  var vi=visItems(d,sc),items=d.items||{},pos=-1,i,nx=vi.length;
  vi.forEach(function(x,j){if(secItemId(sc,x.i)===id)pos=j});
  var un=function(j){var iid=secItemId(sc,vi[j].i);return iid!==id&&!(items[iid]&&items[iid].r)};
  for(i=pos+1;i<vi.length;i++)if(un(i)){nx=i;break}
  if(nx===vi.length)for(i=0;i<=pos&&i<vi.length;i++)if(un(i)){nx=i;break}
  S.step=S.step||{};S.step[d.id+'|'+sc.id]=nx;S.fresh=id;
}

/* --- PDF: pages drawn on canvas (browser shapes Persian), packed as JPEG into a minimal PDF --- */
/* بوم و ابزار مشترک ساخت PDF (فرم ایستگاه و فرم نمونه‌زنی): صفحه، سرتیتر، جدول و شماره‌ی صفحه */
var PDF_FONT='Vazirmatn, Tahoma, Arial, sans-serif';
function pdfPainter(o){
  var P={PW:1240,PH:1754,M:64,pages:[],ctx:null,y:0};
  P.font=function(sz,b){P.ctx.font=(b?'700 ':'400 ')+sz+'px '+PDF_FONT};

    var cv=document.createElement('canvas'),c;cv.width=P.PW;cv.height=P.PH;c=P.ctx=cv.getContext('2d');
    c.fillStyle='#fff';c.fillRect(0,0,P.PW,P.PH);c.direction='rtl';c.textBaseline='top';c.textAlign='right';
    P.y=o.header(P);P.pages.push(cv);
  };
  function wrapLine(t,mw){
    var lines=[],cur='';
    String(t||'').split(/\s+/).forEach(function(w){var test=cur?cur+' '+w:w;if(P.ctx.measureText(test).width>mw&&cur){lines.push(cur);cur=w}else cur=test});
    lines.push(cur);return lines;
  }

  }

    var c=function(){return P.ctx},M=P.M,total=cols.reduce(function(a,x){return a+x.w},0),W=P.PW-2*M,pad=10,LH=o.lh;
    var X=[],x0=P.PW-M;cols.forEach(function(k){var w=W*k.w/total;X.push({r:x0,w:w});x0-=w});
    function head(){
      P.font(o.fs,1);var h=LH+pad*2;P.ensure(h+LH*2);
      c().fillStyle='#dce3f0';c().fillRect(M,P.y,W,h);c().fillStyle='#14213d';c().textAlign='right';
      cols.forEach(function(k,i){c().fillText(k.t,X[i].r-pad,P.y+pad)});
      c().strokeStyle='#9aa5b8';c().lineWidth=1;c().strokeRect(M,P.y,W,h);P.y+=h;
    }
    head();
    rows.forEach(function(r){
      P.font(o.fs,0);
      var lines=r.map(function(v,i){return wrap(v,X[i].w-pad*2)}),n=Math.max.apply(null,lines.map(function(l){return l.length})),h=n*LH+pad*2;
      if(P.y+h>P.PH-M-40){P.newPage();head();P.font(o.fs,0)}
      var bg=tint&&tint(r);if(bg){c().fillStyle=bg;c().fillRect(M,P.y,W,h)}
      c().fillStyle='#1b1b1b';c().textAlign='right';P.font(o.fs,0);
      lines.forEach(function(l,i){l.forEach(function(t,k){c().fillText(t,X[i].r-pad,P.y+pad+k*LH)})});
      c().strokeStyle='#c4ccda';c().strokeRect(M,P.y,W,h);
      X.forEach(function(k){c().beginPath();c().moveTo(k.r-k.w,P.y);c().lineTo(k.r-k.w,P.y+h);c().stroke()});

  };

    });
    return packPdf(P.pages,P.PW,P.PH);
  };
  return P;
}
function buildPdf(rep){

  });

/* ---------- نمونه‌زنی (ثبت توسط کیفیت مونتاژ) ---------- */

  var f=S.sf=S.sf||smpDef();

/* ---------- ثبت نمونه‌زنی مرحله‌به‌مرحله (مثل ایستگاه‌های شاسی، نهایی و تزیینات) ---------- */
var SMP_STEPS=['ایستگاه','قطعه‌ها','حاضرین','شرح','خودروها','تأیید'];

function smpWizOn(){return S.sw!=null&&S.tab==='smp'&&smpCanWrite()}
function smpParts(F){return F.parts.filter(function(p){return p.n.trim()}).map(function(p){return {n:p.n.trim(),q:digits(p.q)}})}

}
function smpBadQty(p){return !/^\d+$/.test(p.q)||+p.q<1}

  if(i===3)return String(F.sm_desc||'').trim()?'':'شرح نمونه‌زنی الزامی است.';

/* مشخصات خودرو را از سرور می‌گیرد ولی ثبت را بیش از ۲.۵ ثانیه معطل نمی‌کند */
function smpSpecsReady(F){

/* شناسه‌ی نمونه‌زنی یک بار برای هر پیش‌نویس ساخته می‌شود؛ لمس چندباره همان یک رکورد را بازنویسی می‌کند */
function smpSubmit(){
  if(S.smpBusy)return;
  smpSync();
  var F=S.sf,bad=smpFirstBad(F);
  if(bad){S.sw=bad.step;S.smpErr=bad.err;render();return}

    var doc=smpDoc(F);
    return save(function(){return store.set('users',F.docId,doc)},'نمونه‌زنی ثبت شد').then(function(ok){
      S.smpBusy=false;
      if(ok){S.sf=null;S.sw=null;S.smpDone=doc;smpDraftClear()}
      render();
    });
  }).then(null,function(){S.smpBusy=false;render()});

/* پیش‌نویس روی همین دستگاه می‌ماند تا با بازشدن دوباره‌ی صفحه نوشته‌ها و مرحله از بین نرود */

function repData(y,m,d){

function qualityCard(y,m){

  }

}
function areaOptions(cur){return Object.keys(AREAS).map(function(k){return '<option value="'+k+'"'+(k===cur?' selected':'')+'>'+esc(AREAS[k].label)+'</option>'}).join('')}
function restoreBtns(){

function rolesCards(){

}
/* ذخیره‌ی کل فهرست نقش‌ها در سند فهرست‌ها */
function rolesSave(next,what){return lsSave(function(c){c.roles=next},what,false)}
function roleFromForm(r){

/* نقش‌های آماده با همان شناسه جایگزین می‌شوند یا اگر نیستند اضافه می‌شوند */
function rolesRestore(){

function roleDelete(id){

  rolesSave(roleDefs().filter(function(x){return x.id!==id}),'حذف نقش '+(r?r.name:''));

/* ================= داشبورد مدیریتی «مرکز راهبری کیفیت و تولید» (فقط‌خواندنی) =================
   همه‌ی اعداد از داده‌ی بارگذاری‌شده‌ی همین دستگاه محاسبه می‌شود و چیزی ذخیره نمی‌شود.
   ساعت هر ثبت، ساعت دستگاه ثبت‌کننده است (تقریبی). ایران ساعت تابستانی ندارد (UTC+3:30). */
var TEHRAN_MS=12600000,DAY_MS=86400000,DASH_PAGE=40,DEF_R={ng:1,sample:1,shortage:1};
var DASH_RANGES=[['today','امروز'],['yday','دیروز'],['d7','۷ روز اخیر'],['d30','۳۰ روز اخیر']];
var DASH_DEF={sec:'follow',fo:'',range:'d30',shift:'',station:'',prod:'',status:'',q:'',sort:'old',more:DASH_PAGE,car:''};
var DASH_NA='اطلاعات در دسترس نیست';
var DASHD=null,DASHR=null; /* DASHD: فهرست تخت رکوردها/ایرادها؛ DASHR: نتیجه‌ی آخرین فیلتر */

function dashAllowed(){
  var u=S.user;if(!u)return false;
  if(isCustomRole(u))return rolePerm('dash');
  return u.id==='owner'||u.station==='quality'||u.station==='planning'||isMgrUser(u);
}
/* حساب مدیریتی هر بار با بازه‌ی «امروز» شروع می‌کند؛ فیلترها با عوض‌شدن کاربر دوباره ساخته می‌شود */
function dashF(){
  var uid=S.user?S.user.id:'';
  if(!S.dash||S.dash.uid!==uid)S.dash=Object.assign({uid:uid},DASH_DEF,isMgrUser(S.user)||isCustomRole(S.user)?{range:'today'}:{});
  return S.dash;
}
function dashFree(){DASHD=null;DASHR=null}

/* ---------- زمان و شیفت ---------- */
function dayStart(ms){return Math.floor((ms+TEHRAN_MS)/DAY_MS)*DAY_MS-TEHRAN_MS}
function dashPeriod(range,now){
  var t0=dayStart(now);
  if(range==='today')return {from:t0,to:t0+DAY_MS};
  if(range==='yday')return {from:t0-DAY_MS,to:t0};
  return {from:t0-((range==='d7'?7:30)-1)*DAY_MS,to:t0+DAY_MS};
}
/* دو نقطه اختیاری است: ۰۷:۰۰، ۰۷۰۰، ۷۳۰ و ۷ (فقط ساعت) هر سه درست‌اند، چون کیبورد عددی گوشی دو نقطه ندارد */
function parseHm(s){var m=/^(?:([01]?\d|2[0-3])[:.٫\/\s]?([0-5]\d)|([01]?\d|2[0-3]))$/.exec(digits(s).trim());return m?(m[3]!=null?+m[3]*60:+m[1]*60+(+m[2])):null}
function fmtHm(min){return ('0'+Math.floor(min/60)).slice(-2)+':'+('0'+min%60).slice(-2)}
/* شیفت ۱ از شروع شیفت ۱ تا شروع شیفت ۲؛ بقیه‌ی ساعت‌ها شیفت ۲. تا تنظیم نشده null برمی‌گردد. */
function shiftCfg(){var c=(S.lists&&S.lists.shift)||{},a=parseHm(c.s1),b=parseHm(c.s2),e=c.s3?parseHm(c.s3):null;return a!=null&&b!=null&&a<b?{s1:a,s2:b,s3:(e!=null&&e>b)?e:null}:null}
function shiftOf(ms,cfg){var m=Math.floor(((ms+TEHRAN_MS)%DAY_MS)/60000);return m>=cfg.s1&&m<cfg.s2?1:2}
function elapsedTxt(ms){
  var m=Math.max(0,Math.floor(ms/60000)),d=Math.floor(m/1440),h=Math.floor(m%1440/60);
  return d?fa(d)+' روز و '+fa(h)+' ساعت':h?fa(h)+' ساعت و '+fa(m%60)+' دقیقه':fa(m)+' دقیقه';
}

/* ---------- جمع‌آوری (یک بار برای هر تغییر داده) ---------- */
function carIdOf(r){var o=identOf(r);return o.chassis||o.serial||o.room||o.engine||r.key}
/* محصول هر خودرو از برگه‌های شاسی/موتور/تزیینات؛ یک بار نمایه می‌شود تا برای هر رکورد کل داده پیمایش نشود */
function dashProdIndex(){
  var by={};
  S.data.insp.forEach(function(r){
    if(!r.product||!SHEETS[r.sheet]||PSHEETS.indexOf(r.sheet)<0)return;
    var o=identOf(r);['serial','chassis','engine','room'].forEach(function(f){if(o[f])by[o[f]]=r.product});
  });
  return by;
}
function dashProd(r,by){
  var raw=r.product;
  if(!raw&&PSHEETS.indexOf(r.sheet)<0){var o=identOf(r);raw=by[o.chassis]||by[o.serial]||by[o.room]||by[o.engine]||''}
  return raw==='ex'?'ex':'padra';
}
function dashCollect(){
  var recs=[],defs=[],prodBy=dashProdIndex(),scope=userSheets();
  S.data.insp.forEach(function(r){
    if(r.test||!SHEETS[r.sheet]||(scope&&scope.indexOf(r.sheet)<0))return;
    var base={r:r,car:carIdOf(r),prod:dashProd(r,prodBy)},ms=Date.parse(r.createdAt);
    if(!isNaN(ms))recs.push(Object.assign({ms:ms},base));
    var items=r.items||{};
    Object.keys(items).forEach(function(id){
      var it=items[id],dm=Date.parse(it.at||r.createdAt);
      if(DEF_R[it.r]&&!isNaN(dm))defs.push(Object.assign({ms:dm,id:id,it:it,open:!it.closedAt},base));
    });
  });
  return {recs:recs,defs:defs};
}
function dashData(){
  var scopeKey=String(userSheets());
  if(!DASHD||DASHD.insp!==S.data.insp||DASHD.scopeKey!==scopeKey)DASHD={insp:S.data.insp,scopeKey:scopeKey,data:dashCollect(),labels:{}};
  return DASHD.data;
}

/* ---------- محاسبه ---------- */
function dashPredicates(F,cfg){
  return {
    base:function(x){return (!F.prod||x.prod===F.prod)&&(!F.station||x.r.sheet===F.station)},
    shiftOk:function(x){return !F.shift||(!!cfg&&shiftOf(x.ms,cfg)===+F.shift)},
    statusOk:function(x){return !F.status||(F.status==='open')===x.open}
  };
}
function countCars(recs){var s={};recs.forEach(function(x){s[x.car]=1});return Object.keys(s).length}
function dashStations(recs,defs){
  var out={};
  STAGES.forEach(function(k){out[k]={ids:{},cars:0,defects:0,open:0,last:null,lastMs:0}});
  recs.forEach(function(x){var s=out[x.r.sheet];s.ids[x.car]=1;if(!s.last||x.ms>s.lastMs){s.last=x.r;s.lastMs=x.ms}});
  defs.forEach(function(x){var s=out[x.r.sheet];s.defects++;if(x.open)s.open++});
  STAGES.forEach(function(k){out[k].cars=Object.keys(out[k].ids).length;delete out[k].ids});
  return out;
}
/* متن آیتم برای هر (برگه، آیتم، محصول) یک بار ساخته می‌شود */
function defectLabel(x){
  var it=x.it;if(it.custom)return it.part||it.free||it.note||'توضیح دستی';
  dashData();var L=DASHD.labels,k=x.r.sheet+'|'+x.id+'|'+x.prod;
  return L[k]||(L[k]=labelOf(x.r.sheet,x.id,x.r));
}
function dashPareto(defs){
  var count={};
  defs.forEach(function(x){var k=SHEETS[x.r.sheet].name+' - '+defectLabel(x);count[k]=(count[k]||0)+1});
  return Object.keys(count).map(function(k){return {k:k,n:count[k]}}).sort(function(a,b){return b.n-a.n}).slice(0,8);
}
function dashDaily(defs,pass,now){
  var t0=dayStart(now),days=[];
  for(var i=6;i>=0;i--)days.push({from:t0-i*DAY_MS,n:0});
  defs.forEach(function(x){var i=Math.floor((x.ms-days[0].from)/DAY_MS);if(i>=0&&i<7&&pass(x))days[i].n++});
  return days;
}
function dashShifts(recs,defs,cfg){
  var out=[{ids:{},defects:0},{ids:{},defects:0}];
  recs.forEach(function(x){out[shiftOf(x.ms,cfg)-1].ids[x.car]=1});
  defs.forEach(function(x){out[shiftOf(x.ms,cfg)-1].defects++});
  return out.map(function(s){return {cars:Object.keys(s.ids).length,defects:s.defects}});
}
function dashCompute(F,now){
  var D=dashData(),cfg=shiftCfg(),P=dashPeriod(F.range,now),f=dashPredicates(F,cfg);
  var inP=function(x){return x.ms>=P.from&&x.ms<P.to&&f.base(x)};
  var recsIn=D.recs.filter(inP),defsIn=D.defs.filter(inP);
  var recs=recsIn.filter(f.shiftOk),defsShift=defsIn.filter(f.shiftOk),defs=defsShift.filter(f.statusOk);
  var st=dashStations(recs,defs),keys=F.station?[F.station]:(userSheets()||STAGES);
  return {
    period:P,cfg:cfg,keys:keys,stations:st,defTotal:defs.length,nRecs:recs.length,
    cars:countCars(recs),
    openList:defsShift.filter(function(x){return x.open}).sort(function(a,b){return a.ms-b.ms}),
    withRecords:keys.filter(function(k){return st[k].cars>0}).length,
    pareto:dashPareto(defs),
    daily:dashDaily(D.defs,function(x){return f.base(x)&&f.shiftOk(x)&&f.statusOk(x)},now),
    shifts:cfg?dashShifts(recsIn,defsIn.filter(f.statusOk),cfg):null
  };
}
function dashResult(F,now){
  var key=[F.range,F.shift,F.station,F.prod,F.status,dayStart(now),String(userSheets()),JSON.stringify((S.lists&&S.lists.shift)||'')].join('|');
  if(!DASHR||DASHR.insp!==S.data.insp||DASHR.key!==key)DASHR={insp:S.data.insp,key:key,res:dashCompute(F,now)};
  return DASHR.res;
}

/* ---------- صفحه ---------- */
function dashPeriodTxt(P){
  return 'از تاریخ '+dateOnly(new Date(P.from).toISOString())+' تا تاریخ '+dateOnly(new Date(P.to-1).toISOString());
}
function dashChips(key,items,cur){
  return '<div class="dchips">'+items.map(function(x){
    return '<button type="button" class="pick" data-act="dset" data-k="'+key+'" data-v="'+x[0]+'" aria-pressed="'+(cur===x[0])+'">'+x[1]+'</button>';
  }).join('')+'</div>';
}
function dashNote(){
  var D=dashData(),err='';
  if(S.connErr)err='<p class="err" style="margin:8px 0 0">اتصال به سرور برقرار نیست؛ اعداد ممکن است ناقص باشند.</p>';
  else if(!D.recs.length&&!D.defs.length)err='<p class="err" style="margin:8px 0 0">هنوز داده‌ای بارگذاری نشده است؛ صفرها به معنی «بدون ثبت» نیست.</p>';
  return err+'<details class="dnote"><summary class="hint">توضیح اعداد و محدودیت‌ها</summary><p class="hint">این صفحه فقط برای مشاهده است. اعداد از داده‌ی بارگذاری‌شده‌ی همین دستگاه ('+fa(winDays())+' روز اخیر) محاسبه می‌شود و ساعت هر ثبت، ساعت دستگاه ثبت‌کننده است (تقریبی). «ایراد» در این صفحه شامل ایراد، کسری و قطعه نمونه است. شمار خودرو بر اساس شماره‌ی ثبت‌شده در هر برگه است.</p>'+winNoteBody()+'</details>';
}
function dashFilterBody(F,R){
  var shift=R.cfg?dashChips('shift',[['','همه'],['1','شیفت ۱ (صبح)'],['2','شیفت ۲ (بعدازظهر)']],F.shift)
    :'<p class="hint" style="margin:6px 0 0">تنظیم نشده (مدیر ساعت شروع شیفت‌ها را در «تنظیمات» وارد کند)</p>';
  var opts=[['','همه‌ی ایستگاه‌ها']].concat((userSheets()||STAGES).map(function(k){return [k,SHEETS[k].name]})).map(function(o){
    return '<option value="'+o[0]+'"'+(o[0]===F.station?' selected':'')+'>'+esc(o[1])+'</option>';
  }).join('');
  return '<div style="margin-top:10px"><b>شیفت</b>'+shift+'</div>'+
    '<label class="f" style="margin-top:10px">ایستگاه<select class="in" id="dash_station">'+opts+'</select></label>'+
    '<div style="margin-top:10px"><b>محصول</b>'+dashChips('prod',[['','همه'],['padra','پادرا'],['ex','اکستند']],F.prod)+'</div>'+
    '<div style="margin-top:10px"><b>وضعیت ایراد (برای تحلیل‌ها)</b>'+dashChips('status',[['','همه'],['open','باز'],['closed','بسته‌شده']],F.status)+'</div>'+
    '<p class="hint" style="margin:8px 0 0">فهرست «نیازمند پیگیری» همیشه فقط موارد باز را نشان می‌دهد.</p>';
}
function dashLabel(list,v){var x=list.filter(function(o){return o[0]===v})[0];return x?x[1]:''}
function dashSummary(F,R){
  var sh=!R.cfg?'':F.shift?' · شیفت '+fa(F.shift):' · همه شیفت‌ها';
  return esc(dashLabel(DASH_RANGES,F.range))+sh+' · '+(F.station?esc(SHEETS[F.station].name):'همه ایستگاه‌ها')+' · '+(F.prod?esc(PRODN[F.prod]):'پادرا و اکستند')+'<br>'+dashPeriodTxt(R.period);
}
function dashHead(F,R){
  return '<div class="card dhead"><div class="row"><h2 class="grow" style="margin:0;font-size:18px">مرکز راهبری</h2><button class="btn sm" data-act="dset" data-k="fo" data-v="'+(F.fo?'':'1')+'" aria-expanded="'+!!F.fo+'">'+(F.fo?'بستن فیلتر ▴':'فیلتر ▾')+'</button></div>'+
    '<p class="hint dsum">'+dashSummary(F,R)+'</p>'+(F.fo?dashFilterBody(F,R):'')+dashNote()+'</div>';
}
function dashKv(title,value,sub,small,tone){
  return '<div class="kv'+(tone?' '+tone:'')+'"><small>'+title+'</small><b class="num'+(small?' dna':'')+'">'+value+'</b>'+(sub?'<small>'+sub+'</small>':'')+'</div>';
}
function dashCards(R){
  return '<div class="card dcards"><div class="kvs">'+
    dashKv('خودروهای ثبت‌شده',fa(R.cars),'',false,'info')+
    dashKv('ایرادهای باز',fa(R.openList.length),'',false,R.openList.length?'bad':'good')+
    dashKv('ایستگاه‌های دارای ثبت',fa(R.withRecords)+' از '+fa(R.keys.length),'',false,R.withRecords===R.keys.length?'good':'')+
    dashKv('منتظر تأیید','—','در برنامه ثبت نمی‌شود')+
    '</div></div>';
}
function dashDesc(x){return defectLabel(x)+(!x.it.custom&&x.it.note?' — '+x.it.note:'')}
function dashItem(head,lines){
  return '<div class="ditem"><div class="dh">'+head+'</div>'+lines.map(function(l){return '<div class="dl">'+l+'</div>'}).join('')+'</div>';
}
function dashLine(label,value){return '<small>'+label+':</small> '+value}
function dashTypeChip(r){return '<span class="chip '+(r==='ng'?'open':r)+'">'+esc(typeName(r))+'</span>'}
function dashFollowRow(x,now){
  return '<details class="dfrow"><summary><div class="l1"><b class="num">'+esc(x.car)+'</b><span class="dst">'+esc(SHEETS[x.r.sheet].name)+'</span>'+dashTypeChip(x.it.r)+'</div>'+
    '<div class="l2"><span class="ds">'+esc(dashDesc(x))+'</span><span class="dw">'+esc(elapsedTxt(now-x.ms))+'</span></div></summary>'+
    '<div class="dbody"><div>'+dashLine('شرح',esc(dashDesc(x)))+'</div><div>'+whoWhen(x.it.by,x.it.at||x.r.createdAt)+'</div><div>'+dashLine('مدت انتظار',elapsedTxt(now-x.ms))+'</div><div>'+dashLine('آخرین اقدام','اقدامی ثبت نشده')+'</div></div></details>';
}
function dashFollowRows(R,F){
  var rows=R.openList,q=digits(F.q);
  if(q)rows=rows.filter(function(x){return String(x.car).indexOf(q)>=0});
  return F.sort==='new'?rows.slice().reverse():rows;
}
function dashFollowCard(F,R,now){
  var rows=dashFollowRows(R,F),shown=rows.slice(0,F.more);
  var h='<div class="card"><h2>موارد نیازمند پیگیری ('+fa(rows.length)+')</h2>'+
    '<form data-form="dashq" class="row"><label class="f grow">جست‌وجوی شماره خودرو<input class="in num ltr" id="dq" inputmode="numeric" autocomplete="off" value="'+esc(F.q)+'"></label><button class="btn" type="submit">جست‌وجو</button></form>'+
    dashChips('sort',[['old','قدیمی‌ترین انتظار اول'],['new','تازه‌ترین اول']],F.sort);
  if(!rows.length)return h+'<p class="hint" style="margin:10px 0 0">'+(F.q?'موردی با این شماره پیدا نشد.':'مورد بازی در این بازه نیست.')+'</p></div>';
  h+=shown.map(function(x){return dashFollowRow(x,now)}).join('');
  if(rows.length>shown.length)h+='<button class="btn sm" data-act="dmore" style="margin-top:10px">نمایش بیشتر ('+fa(rows.length-shown.length)+' مورد دیگر)</button>';
  return h+'</div>';
}
function dashStationRow(k,s){
  var none=!s.cars,rate=s.cars?Math.min(100,Math.round(s.defects*100/s.cars)):0;
  var last=s.last?'<details><summary>آخرین ثبت برگه</summary>'+whoWhen(s.last.createdBy,s.last.createdAt)+'</details>':'';
  return '<div class="dst2'+(s.open?' bad':'')+(none?' none':'')+'"><div class="nm">'+esc(SHEETS[k].name)+'</div>'+
    (none?'<span class="hint">بدون ثبت در بازه</span>':'<div class="nums"><span><small>خودرو</small><b class="num">'+fa(s.cars)+'</b></span><span><small>ایراد</small><b class="num">'+fa(s.defects)+'</b></span><span><small>باز</small><b class="num">'+fa(s.open)+'</b></span></div><div class="dbr" title="ایراد به ازای هر خودرو"><i style="width:'+rate+'%"></i></div>'+last)+'</div>';
}
function dashStationsCard(R){
  var none=R.keys.filter(function(k){return !R.stations[k].cars});
  var h='<div class="card"><h2>وضعیت ایستگاه‌ها</h2>';
  if(none.length&&none.length<R.keys.length)h+='<p class="err" style="margin:0">ایستگاه‌های بدون ثبت در این بازه: '+none.map(function(k){return esc(SHEETS[k].name)}).join('، ')+'</p>';
  else if(none.length)h+='<p class="hint" style="margin:0">در این بازه هیچ ثبتی نیست.</p>';
  return h+'<div class="dgrid">'+R.keys.map(function(k){return dashStationRow(k,R.stations[k])}).join('')+'</div>'+
    '<p class="hint" style="margin:10px 0 0">نوار قرمز: ایراد به ازای هر خودروی بازرسی‌شده. «بدون ثبت» یعنی در داده‌ی بارگذاری‌شده ثبتی نیست؛ لزوماً به معنی توقف ایستگاه نیست.</p></div>';
}
function dashBar(label,n,max,extra,color){
  var pc=max?Math.round(n*100/max):0;
  return '<div style="margin:6px 0"><div style="display:flex;justify-content:space-between;gap:8px;font-size:13px"><span>'+label+'</span><span class="num"><bdi>'+fa(n)+(extra||'')+'</bdi></span></div>'+
    '<div style="height:10px;background:#8883;border-radius:5px;overflow:hidden"><div style="width:'+pc+'%;height:100%;background:'+(color||'var(--open)')+'"></div></div></div>';
}
function dashDayLabel(from){var j=jal(new Date(from+12*3600000).toISOString());return j?fa(j.d)+' '+JM[j.m-1]:''}
function dashShiftBlock(R){
  if(!R.shifts)return '<p class="hint" style="margin:0">مقایسه‌ی شیفت‌ها: تنظیم نشده (ساعت شروع شیفت‌ها در «تنظیمات» وارد شود).</p>';
  var mx=Math.max(R.shifts[0].defects,R.shifts[1].defects);
  return R.shifts.map(function(s,i){return dashBar('شیفت '+fa(i+1)+' · '+fa(s.cars)+' خودرو',s.defects,mx,'',i?'var(--wait)':'var(--stamp)')}).join('');
}
function dashAnalysisCard(R){
  var dmx=Math.max.apply(null,R.daily.map(function(d){return d.n})),cum=0;
  var h='<div class="card"><h2>تحلیل</h2><h3 class="dsec" style="margin-top:0">ایرادهای ۷ روز اخیر</h3>'+
    R.daily.map(function(d){return dashBar(dashDayLabel(d.from),d.n,dmx,'','var(--stamp)')}).join('')+
    '<h3 class="dsec">شیفت ۱ و شیفت ۲ (در بازه)</h3>'+dashShiftBlock(R)+
    '<h3 class="dsec">پارتو: پرتکرارترین موارد (در بازه)</h3>';
  if(!R.pareto.length)return h+'<p class="hint" style="margin:0">موردی ثبت نشده است.</p></div>';
  R.pareto.forEach(function(x){cum+=x.n;h+=dashBar(esc(x.k),x.n,R.pareto[0].n,' ('+fa(Math.round(x.n*100/R.defTotal))+'٪ - تجمعی '+fa(Math.round(cum*100/R.defTotal))+'٪)')});
  return h+'</div>';
}

/* ---------- پرونده‌ی سریع خودرو ---------- */
function stageStatus(d){
  if(!d)return 'ثبتی وجود ندارد (بازرسی تأیید نشده)';
  var s=stat(d),made=Object.keys(d.items||{}).filter(function(id){return DEF_R[d.items[id].r]}).length;
  if(s.open)return fa(s.open)+' مورد باز';
  if(!s.ans)return 'برگه باز شده، هنوز بازرسی نشده';
  if(s.ans<s.total)return 'در حال بازرسی ('+fa(s.ans)+' از '+fa(s.total)+')';
  return made?'بازرسی کامل؛ '+fa(made)+' مورد ثبت و بسته شده':'بازرسی کامل، بدون ایراد';
}
function dashCarRows(C){
  var by={};C.recs.forEach(function(d){by[d.sheet]=d});
  return STAGES.map(function(k){
    var d=by[k];return dashItem('<span>'+esc(SHEETS[k].name)+'</span>',[esc(stageStatus(d))].concat(d?[whoWhen(d.createdBy,d.createdAt)]:[]));
  }).join('');
}
function dashCarCard(F){
  var h='<div class="card"><h2>پرونده‌ی سریع خودرو</h2><form data-form="dashcar" class="row"><label class="f grow">شماره شاسی یا سریال<input class="in num ltr" id="dcq" inputmode="numeric" autocomplete="off" value="'+esc(F.car)+'"></label><button class="btn primary" type="submit">نمایش</button></form>';
  if(!F.car)return h+'</div>';
  var C=carRecords(F.car);
  if(!C.recs.length)return h+'<p class="hint" style="margin:10px 0 0">برای این شماره در داده‌ی بارگذاری‌شده ثبتی پیدا نشد (ممکن است قدیمی‌تر از بازه‌ی بارگذاری باشد).</p></div>';
  return h+'<p class="hint" style="margin:10px 0 0">شاسی: <bdi>'+esc(C.I.chassis||'—')+'</bdi> · سریال: <bdi>'+esc(C.I.serial||'—')+'</bdi> · موتور: <bdi>'+esc(C.I.engine||'—')+'</bdi></p>'+
    dashCarRows(C)+'</div>';
}
function dashExportCard(){
  return '<div class="card"><h2>خروجی</h2><p class="hint" style="margin:0 0 10px">فایل شامل تاریخ تهیه و فیلترهای انتخاب‌شده است.</p><div class="row"><button class="btn" data-act="dashx" data-k="xlsx">دانلود اکسل</button><button class="btn" data-act="dashx" data-k="pdf">دانلود PDF</button></div></div>';
}
var DASH_SECS=[['follow','پیگیری'],['stations','ایستگاه‌ها'],['analysis','تحلیل'],['car','خودرو'],['export','خروجی']];
var DASH_BODY={
  follow:function(F,R,now){return dashFollowCard(F,R,now)},
  stations:function(F,R){return dashStationsCard(R)},
  analysis:function(F,R){return dashAnalysisCard(R)},
  car:function(F){return dashCarCard(F)},
  export:function(){return dashExportCard()}
};
function dashTabs(F,R){
  return '<div class="subtabs" role="tablist">'+DASH_SECS.map(function(x){
    var n=x[0]==='follow'&&R.openList.length?'<span class="cnt">'+fa(R.openList.length)+'</span>':'';
    return '<button type="button" class="subtab" role="tab" data-act="dset" data-k="sec" data-v="'+x[0]+'" aria-selected="'+(F.sec===x[0])+'">'+x[1]+n+'</button>';
  }).join('')+'</div>';

function dashView(){
  if(!dashAllowed())return '<div class="card"><p class="hint" style="margin:0">این بخش برای شما فعال نیست.</p></div>';
  var F=dashF(),now=Date.now();
  if(!shiftCfg())F.shift='';
  if(!DASH_BODY[F.sec])F.sec='follow';
  var R=dashResult(F,now);
  return dashHead(F,R)+dashLiveView(F,now)+dashCards(R)+'<div class="dsticky">'+dashChips('range',DASH_RANGES,F.range)+dashTabs(F,R)+'</div>'+DASH_BODY[F.sec](F,R,now)+'<button type="button" class="totop" data-act="totop" aria-label="برگشت به بالا">▲</button>';

/* ---------- ثبت توقف خط (واحد برنامه‌ریزی) ---------- */
function canStop(){return !!S.user&&S.user.station==='planning'}
function openStops(){return (S.stops||[]).filter(function(x){return !x.endAt})}
function stopTab(){var n=openStops().length;return '<button class="tab" role="tab" data-act="tab" data-t="stop" aria-selected="'+(S.tab==='stop')+'">توقف خط'+(n?'<span class="cnt">'+fa(n)+'</span>':'')+'</button>'}
function stopOptions(list,cur){
  var all=cur&&list.indexOf(cur)<0?list.concat([cur]):list;
  return all.map(function(v){return '<option'+(v===cur?' selected':'')+'>'+esc(v)+'</option>'}).join('');
}
function minuteOfDay(iso){return Math.floor(((Date.parse(iso)+TEHRAN_MS)%DAY_MS)/60000)}
function stopTimeMs(min){return dayStart(Date.now())+min*60000}
function stopError(line,reason,sm,em,now){
  if(!line||!reason)return 'خط و دلیل توقف را انتخاب کنید.';
  if((val('st_from')&&sm==null)||(val('st_to')&&em==null))return 'ساعت را فقط با عدد بنویسید (مثلاً ۰۹۳۰).';
  var start=sm==null?now:stopTimeMs(sm);
  if(start>now+60000)return 'ساعت شروع از الان دیرتر است.';
  if(em!=null){var end=stopTimeMs(em);if(end<=start)return 'ساعت پایان باید بعد از ساعت شروع باشد.';if(end>now+60000)return 'ساعت پایان از الان دیرتر است.'}
  if(em==null&&openStops().some(function(x){return x.line===line}))return 'برای این خط یک توقف باز هست؛ اول آن را پایان دهید.';
  return '';
}
function stopAdd(){
  var line=val('st_line'),reason=val('st_reason'),now=Date.now();
  var sm=val('st_from')?parseHm(val('st_from')):null,em=val('st_to')?parseHm(val('st_to')):null;
  var err=stopError(line,reason,sm,em,now);if(err){toast(err);return}
  var doc={kind:'stop',line:line,reason:reason,note:val('st_note'),startAt:new Date(sm==null?now:stopTimeMs(sm)).toISOString(),endAt:em==null?'':new Date(stopTimeMs(em)).toISOString(),by:S.user.name,byId:S.user.id,at:nowIso()};
  ['st_from','st_to','st_note'].forEach(function(k){var e=document.getElementById(k);if(e)e.value=''});
  save(function(){return store.set('users','stop_'+uid(),doc)},'توقف ثبت شد');
}
/* خطای ویرایش توقف؛ ساعت‌ها روی همان روزِ شروع توقف حساب می‌شوند */
function stopEditError(x,line,reason,sm,em,now){
  if(!line||!reason)return 'خط و دلیل توقف را انتخاب کنید.';
  if(sm==null||(val('se_to')&&em==null))return 'ساعت را فقط با عدد بنویسید (مثلاً ۰۹۳۰).';
  var day=dayStart(Date.parse(x.startAt)),start=day+sm*60000,end=em==null?0:day+em*60000;
  if(start>now+60000||end>now+60000)return 'ساعت از الان دیرتر است.';
  if(em!=null&&end<=start)return 'ساعت پایان باید بعد از ساعت شروع باشد.';
  if(em==null&&openStops().some(function(o){return o.id!==x.id&&o.line===line}))return 'برای این خط یک توقف باز دیگر هست؛ اول آن را پایان دهید.';
  return '';
}
function stopEdit(id){
  var x=(S.stops||[]).filter(function(r){return r.id===id})[0];
  if(!x)return;
  var line=val('se_line'),reason=val('se_reason'),sm=parseHm(val('se_from')),em=val('se_to')?parseHm(val('se_to')):null;
  var err=stopEditError(x,line,reason,sm,em,Date.now());if(err){toast(err);return}
  var day=dayStart(Date.parse(x.startAt)),ch={line:line,reason:reason,note:val('se_note'),startAt:new Date(day+sm*60000).toISOString(),endAt:em==null?'':new Date(day+em*60000).toISOString(),editBy:S.user.name,editById:S.user.id,editAt:nowIso()};
  S.stopEdit='';
  save(function(){return store.update('users',id,ch)},'توقف ویرایش شد');
}
function stopEnd(id){
  var x=(S.stops||[]).filter(function(r){return r.id===id})[0];
  if(!x||x.endAt)return;
  save(function(){return store.update('users',id,{endAt:nowIso(),endBy:S.user.name,endById:S.user.id})},'پایان توقف ثبت شد');
}
function stopEditForm(x){
  return '<form data-form="stopedit" data-id="'+esc(x.id)+'" class="mgform"><div class="it">'+
    '<label class="f">خط<select class="in" id="se_line">'+stopOptions(listK('stopLines'),x.line)+'</select></label>'+
    '<label class="f">دلیل توقف<select class="in" id="se_reason">'+stopOptions(listK('stopReasons'),x.reason)+'</select></label>'+
    '<div class="mgrow"><label class="f">ساعت شروع<input class="in num ltr" id="se_from" inputmode="numeric" autocomplete="off" value="'+fmtHm(minuteOfDay(x.startAt))+'"></label>'+
    '<label class="f">ساعت پایان (خالی = هنوز ادامه دارد)<input class="in num ltr" id="se_to" inputmode="numeric" autocomplete="off" value="'+(x.endAt?fmtHm(minuteOfDay(x.endAt)):'')+'"></label></div>'+
    '<label class="f">توضیح<input class="in" id="se_note" autocomplete="off" value="'+esc(x.note||'')+'"></label>'+
    '<div class="row"><button class="btn primary sm" type="submit">ذخیره‌ی تغییر</button><button class="btn sm" type="button" data-act="stopeditno">انصراف</button></div></div></form>';
}
function stopManageBtns(x){
  if(S.stopDel===x.id)return '<div class="row" style="margin-top:8px"><button class="btn sm" data-act="stopdelyes" data-id="'+esc(x.id)+'">تأیید حذف</button><button class="btn sm" data-act="stopdelno">انصراف</button></div>';
  return '<div class="row" style="margin-top:8px"><button class="btn sm" data-act="stopedit" data-id="'+esc(x.id)+'">ویرایش</button><button class="btn sm" data-act="stopdelask" data-id="'+esc(x.id)+'">حذف</button></div>';

function stopItem(x,now,canEnd){
  if(canEnd&&S.stopEdit===x.id)return stopEditForm(x);
  var end=x.endAt?Date.parse(x.endAt):now,dur=elapsedTxt(end-Date.parse(x.startAt));
  return '<div class="it"><div class="row"><b class="grow">'+esc(x.line)+'</b><span class="chip '+(x.endAt?'closed':'open')+'">'+(x.endAt?'پایان یافته':'باز')+'</span></div>'+
    '<div class="m">دلیل: '+esc(x.reason)+'</div>'+
    '<div class="m">شروع: '+esc(dateOnly(x.startAt))+' — ساعت '+esc(hm(x.startAt))+'</div>'+
    (x.endAt?'<div class="m">پایان: '+esc(dateOnly(x.endAt))+' — ساعت '+esc(hm(x.endAt))+'</div>':'')+
    '<div class="m">مدت: '+dur+'</div>'+(x.note?'<div class="m">توضیح: '+esc(x.note)+'</div>':'')+
    '<div class="m">'+whoWhen(x.by,x.at,'ثبت‌کننده')+'</div>'+
    (x.editAt?'<div class="m">'+whoWhen(x.editBy,x.editAt,'ویرایش‌کننده')+'</div>':'')+
    (canEnd&&!x.endAt?'<button class="btn sm primary" data-act="stopend" data-id="'+esc(x.id)+'" style="margin-top:8px">پایان توقف (همین حالا)</button>':'')+
    (canEnd?stopManageBtns(x):'')+'</div>';
}
function stopView(){
  var now=Date.now(),all=(S.stops||[]).slice().sort(function(a,b){return (b.startAt||'')<(a.startAt||'')?-1:1});
  var open=all.filter(function(x){return !x.endAt}),done=all.filter(function(x){return x.endAt}).slice(0,15);
  var h='<div class="card"><h2>ثبت توقف خط</h2><form data-form="stopadd" class="mgform">'+
    '<label class="f">خط<select class="in" id="st_line">'+stopOptions(listK('stopLines'))+'</select></label>'+
    '<label class="f">دلیل توقف<select class="in" id="st_reason">'+stopOptions(listK('stopReasons'))+'</select></label>'+
    '<div class="mgrow"><label class="f">ساعت شروع (خالی = همین حالا)<input class="in num ltr" id="st_from" inputmode="numeric" autocomplete="off" placeholder="0930"></label>'+
    '<label class="f">ساعت پایان (خالی = هنوز ادامه دارد)<input class="in num ltr" id="st_to" inputmode="numeric" autocomplete="off" placeholder="1000"></label></div>'+
    '<label class="f">توضیح (اختیاری)<input class="in" id="st_note" autocomplete="off"></label>'+
    '<button class="btn primary" type="submit">ثبت توقف</button></form></div>';
  h+='<div class="card"><h2>توقف‌های باز ('+fa(open.length)+')</h2>'+(open.length?open.map(function(x){return stopItem(x,now,true)}).join(''):'<p class="hint" style="margin:0">توقف بازی نیست.</p>')+'</div>';
  if(done.length)h+='<div class="card"><h2>آخرین توقف‌های پایان‌یافته</h2>'+done.map(function(x){return stopItem(x,now,canStop())}).join('')+'</div>';

/* ---------- کسری‌های برنامه‌ریزی (جدا از ایراد/کسری چکمن‌ها؛ هر ردیف یک سند psh_*) ---------- */
function isPlanningUser(u){return !!u&&u.station==='planning'&&!isMgrUser(u)&&!isCustomRole(u)}
function canPlanShort(){return isPlanningUser(S.user)}
function openPsh(){return (S.pshorts||[]).filter(function(x){return !x.closedAt})}
function pshTab(){var n=openPsh().length;return '<button class="tab" role="tab" data-act="tab" data-t="psh" aria-selected="'+(S.tab==='psh')+'">کسری برنامه‌ریزی'+(n?'<span class="cnt">'+fa(n)+'</span>':'')+'</button>'}
var PSH_ST={'شاسی و موتور':'chassis','تزیینات':'trim','نهایی بالا':'st4','نهایی پایین':'st5'};
function pshStLabel(st){return Object.keys(PSH_ST).filter(function(k){return PSH_ST[k]===st})[0]||''}
/* «کد — شرح — ایستگاه مسئول»؛ ایستگاه و کد اختیاری‌اند */
function pshSplit(item){
  var parts=item.split(' — '),st='';
  if(parts.length>1&&PSH_ST[parts[parts.length-1]]){st=PSH_ST[parts.pop()]}
  return parts.length>1?{code:parts[0],text:parts.slice(1).join(' — '),st:st}:{code:'',text:parts[0],st:st};
}
function pshPicker(){
  var sel=S.psSel||{},q=norm(S.psQ||'');
  return listK('planShorts').map(function(it){
    var p=pshSplit(it),hide=q&&norm(it).indexOf(q)<0;
    return '<label class="pshrow" data-q="'+esc(it)+'"'+(hide?' style="display:none"':'')+'><input type="checkbox" data-act="pssel" data-v="'+esc(it)+'"'+(sel[it]?' checked':'')+'><span class="num ltr">'+esc(p.code)+'</span><span class="grow">'+esc(p.text)+'<small class="hint" style="display:block">'+esc(pshStLabel(p.st)||'ایستگاه مشخص نشده')+'</small></span></label>';
  }).join('');
}
function pshFilterDom(v){
  var q=norm(v);
  Array.prototype.forEach.call(document.querySelectorAll('#pshlist .pshrow'),function(e){e.style.display=(!q||norm(e.getAttribute('data-q')).indexOf(q)>=0)?'':'none'});
}
function pshFindDom(v){
  var q=digits(v);
  Array.prototype.forEach.call(document.querySelectorAll('#pshopen [data-k]'),function(e){e.style.display=(!q||e.getAttribute('data-k').indexOf(q)>=0)?'':'none'});
}
function pshSelCount(){return Object.keys(S.psSel||{}).length}
function pshAddCard(){
  return '<div class="card"><h2>ثبت کسری برای یک خودرو</h2><form data-form="pshadd" class="mgform">'+
    '<div class="row"><label class="f grow">سریال، شاسی، موتور یا اتاق<input class="in num ltr" id="ps_key" inputmode="numeric" autocomplete="off"></label><button type="button" class="btn" data-act="livescan" data-scan="ps_key" style="align-self:flex-end">اسکن بارکد</button></div>'+
    '<label class="f">جستجو در فهرست (کد یا نام قطعه)<input class="in" id="psq" autocomplete="off" value="'+esc(S.psQ||'')+'"></label>'+
    '<div id="pshlist" class="pshlist">'+pshPicker()+'</div>'+
    '<button class="btn primary" type="submit">ثبت <span id="pshn">'+fa(pshSelCount())+'</span> کسری</button></form></div>';
}
function pshAdd(){
  var typed=digits(val('ps_key')),sel=Object.keys(S.psSel||{});
  if(!typed){toast('شماره‌ی خودرو را بنویسید');return}
  if(!sel.length){toast('حداقل یک کسری را انتخاب کنید');return}
  var car=carRecords(typed).key,have={};
  openPsh().forEach(function(x){if(x.car===car)have[x.code+'|'+x.text]=1});
  var now=nowIso(),docs=[];
  sel.forEach(function(it){var p=pshSplit(it);if(!have[p.code+'|'+p.text])docs.push({kind:'pshort',key:typed,car:car,code:p.code,text:p.text,st:p.st,by:S.user.name,byId:S.user.id,at:now,closedAt:'',closedBy:'',closedById:''})});
  if(!docs.length){toast('این کسری‌ها برای این خودرو از قبل باز هستند');return}
  S.psSel={};S.psQ='';var k=document.getElementById('ps_key');if(k)k.value='';
  save(function(){return Promise.all(docs.map(function(d){return store.set('users','psh_'+uid(),d)}))},fa(docs.length)+' کسری ثبت شد');
}

var CPF_SLOTS=[
  {k:'eng',label:'نماینده مهندسی',list:'cpfEng'},
  {k:'peng',label:'نماینده مهندسی تولید',list:'cpfProdEng'},
  {k:'sup',label:'مسئول / سرپرست تولید (جهت اجرا)'},
  {k:'qual',label:'نماینده کیفیت (تضمین / کنترل کیفیت)',list:'cpfQual'},
  {k:'oth',label:'نماینده سایر واحدهای ذیربط'}
];
var CPF_STATUS={pending:['در انتظار امضا',''],active:['معتبر','shortage'],expired:['منقضی','open'],closed:['بسته شد','closed']};
function mgrUnitOf(u){
  if(!u)return '';
  if(u.mgrUnit)return u.mgrUnit;
  var r=(S.data.users||[]).filter(function(x){return x.id===u.id})[0];
  return (r&&r.mgrUnit)||'';
}
function canCpfCreate(){return !!S.user&&isCustomRole(S.user)&&rolePerm('cpf')}
function cpfAllowed(){var u=S.user;return !!u&&(u.id==='owner'||u.station==='quality'||isMgrUser(u)||canCpfCreate())}
function cpfTab(){var n=cpfWaiting().length;return '<button class="tab" role="tab" data-act="tab" data-t="cpf" aria-selected="'+(S.tab==='cpf')+'">فرم حفاظت از مشتری'+(n?'<span class="cnt">'+fa(n)+'</span>':'')+'</button>'}
function cpfSlots(f){return CPF_SLOTS.filter(function(x){return x.k!=='oth'||f.otherUnit})}
function cpfSigned(f,k){return f['sig_'+k]}
function cpfDateKey(y,m,d){return y*10000+m*100+d}
function cpfStatus(f){
  if(f.closedAt)return 'closed';
  if(cpfSlots(f).some(function(x){return !cpfSigned(f,x.k)}))return 'pending';
  var t=jal(nowIso());return t&&cpfDateKey(t.y,t.m,t.d)>f.vk?'expired':'active';
}
function cpfCanSign(f,k){
  var u=S.user;if(!u||cpfSigned(f,k)||f.closedAt||u.role!=='mgr'&&!(k==='qual'&&u.station==='quality'))return false;
  if(k==='oth')return mgrUnitOf(u)===f.otherUnit;
  if(k==='sup')return false;
  if(k==='qual'&&u.station==='quality')return true;
  var slot=CPF_SLOTS.filter(function(x){return x.k===k})[0];
  return listK(slot.list).indexOf(mgrUnitOf(u))>=0;
}
function cpfWaiting(){return (S.cpfs||[]).filter(function(f){return !f.closedAt&&cpfSlots(f).some(function(x){return cpfCanSign(f,x.k)})})}
function cpfParseDate(txt){
  var t=digits(txt).replace(/[\/\-.]/g,'');
  if(!/^\d{8}$/.test(t))return null;
  var y=+t.slice(0,4),m=+t.slice(4,6),d=+t.slice(6);
  return y<1300||y>1500||m<1||m>12||d<1||d>31?null:{y:y,m:m,d:d,k:cpfDateKey(y,m,d),txt:y+'/'+(m<10?'0':'')+m+'/'+(d<10?'0':'')+d};
}
function cpfCars(txt){
  var seen={},out=[];
  String(txt||'').split(/[\s,،;؛\n]+/).forEach(function(v){var n=digits(v);if(n&&!seen[n]){seen[n]=1;out.push(n)}});
  return out;
}

/* ---------- بخش زنده‌ی داشبورد: تولید امروز، توقف، راندمان، وضعیت خطوط ---------- */
var DASHL=null;
/* دقیقه‌های توقف هر خط در بازه‌ی [from,to]؛ توقف‌های هم‌پوشان یک خط یک‌بار شمرده می‌شوند */
function stopMsByLine(from,to,now){
  var by={};
  (S.stops||[]).forEach(function(x){
    var a=Math.max(Date.parse(x.startAt),from),b=Math.min(x.endAt?Date.parse(x.endAt):now,to);
    if(b>a)(by[x.line]=by[x.line]||[]).push([a,b]);
  });
  Object.keys(by).forEach(function(k){
    var iv=by[k].sort(function(p,q){return p[0]-q[0]}),sum=0,cur=null;
    iv.forEach(function(r){if(cur&&r[0]<=cur[1])cur[1]=Math.max(cur[1],r[1]);else{if(cur)sum+=cur[1]-cur[0];cur=[r[0],r[1]]}});
    if(cur)sum+=cur[1]-cur[0];by[k]=sum;
  });
  return by;
}
function sumMs(by){return Object.keys(by).reduce(function(n,k){return n+by[k]},0)}
/* راندمان = میانگین خط‌ها از (زمان برنامه‌ای − توقف) تقسیم بر زمان برنامه‌ای */
function dashEff(lines,by,plannedMs){
  if(!lines.length||plannedMs<=0)return null;
  return lines.reduce(function(n,l){return n+Math.max(0,1-(by[l]||0)/plannedMs)},0)/lines.length*100;
}
function dashTargetN(F){
  var t=(S.lists&&S.lists.target)||{},n=function(k){return parseInt(digits(t[k]||''),10)||0};
  return F.prod?n(F.prod):n('padra')+n('ex');
}
/* تولید = خودروهای دارای اولین ثبت «نهایی بالا» (شمارش در نصب اتاق)؛ هر خودرو یک بار */
function dashProduction(F,t0){
  var D=dashData(),sc=userSheets(),res={ok:!sc||sc.indexOf('final1')>=0,today:{},yday:0,ngT:0,ngY:0},ydayCars={};
  if(!res.ok)return res;
  D.recs.forEach(function(x){
    if(x.r.sheet!=='final1'||(F.prod&&x.prod!==F.prod))return;
    if(x.ms>=t0){if(!(x.car in res.today)||x.ms<res.today[x.car])res.today[x.car]=x.ms}
    else if(x.ms>=t0-DAY_MS)ydayCars[x.car]=1;
  });
  res.yday=Object.keys(ydayCars).length;
  D.defs.forEach(function(x){
    if(x.it.r!=='ng'||(F.prod&&x.prod!==F.prod))return;
    if(x.ms>=t0)res.ngT++;else if(x.ms>=t0-DAY_MS)res.ngY++;

}
function dashHours(todayMs,t0,now,cfg){
  var cnt={},lo=cfg?Math.floor(cfg.s1/60):6,hi=Math.max(cfg&&cfg.s3?Math.ceil(cfg.s3/60)-1:17,Math.floor((now-t0)/3600000));
  Object.keys(todayMs).forEach(function(c){var h=Math.floor((todayMs[c]-t0)/3600000);cnt[h]=(cnt[h]||0)+1;lo=Math.min(lo,h);hi=Math.max(hi,h)});

}
function dashLiveCompute(F,now){

  var shiftOn=!!(cfg&&cfg.s3),fromT=t0+(shiftOn?cfg.s1:0)*60000,toT=Math.min(now,t0+(shiftOn?cfg.s3:1440)*60000);
  var byT=stopMsByLine(fromT,toT,now),byY=stopMsByLine(fromT-DAY_MS,t0+(shiftOn?cfg.s3:1440)*60000-DAY_MS,now);
  var open=openStops();
  return {
    prodOk:P.ok,prodN:Object.keys(P.today).length,prodY:P.yday,ngT:P.ngT,ngY:P.ngY,target:dashTargetN(F),
    hours:dashHours(P.today,t0,now,cfg),

  };

function dashLive(F,now){

/* مقایسه با دیروز؛ lowerBetter برای توقف و ایراد (کمتر = بهتر) */
function dashDelta(cur,prev,lowerBetter){
  if(!prev)return {txt:cur?'دیروز ثبتی نبود':'—',tone:'flat'};
  var d=Math.round((cur-prev)/prev*100);
  if(!d)return {txt:'بدون تغییر نسبت به دیروز',tone:'flat'};
  var good=lowerBetter?d<0:d>0;
  return {txt:(d>0?'▲ ':'▼ ')+fa(Math.abs(d))+'٪ نسبت به دیروز',tone:good?'good':'bad'};
}

function dashHeroCard(L,now){

/* PDF: صفحه‌ها روی canvas کشیده می‌شود تا مرورگر حروف فارسی را درست بچسباند */
function buildDashPdf(secs,subtitle){
  var PW=1240,PH=1754,M=64,LH=27,pad=8,F='Vazirmatn, Tahoma, Arial, sans-serif',pages=[],cv,ctx,y;
  function font(sz,b){ctx.font=(b?'700 ':'400 ')+sz+'px '+F}
  function newPage(){
    cv=document.createElement('canvas');cv.width=PW;cv.height=PH;ctx=cv.getContext('2d');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,PW,PH);ctx.direction='rtl';ctx.textBaseline='top';ctx.textAlign='right';
    font(30,1);ctx.fillStyle='#14213d';ctx.fillText('مرکز راهبری کیفیت و تولید - زامیاد',PW-M,M);
    font(20,0);ctx.fillStyle='#555';ctx.fillText(subtitle,PW-M,M+42);
    ctx.strokeStyle='#14213d';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(M,M+74);ctx.lineTo(PW-M,M+74);ctx.stroke();
    pages.push(cv);y=M+94;
  }
  function wrap(t,mw){
    var lines=[],cur='';
    String(t||'').split(/\s+/).forEach(function(w){var test=cur?cur+' '+w:w;if(ctx.measureText(test).width>mw&&cur){lines.push(cur);cur=w}else cur=test});
    lines.push(cur);return lines;
  }
  function columns(sec){
    var total=sec.w.reduce(function(a,b){return a+b},0),x=PW-M;
    return sec.w.map(function(w){var cw=(PW-2*M)*w/total,c={r:x,w:cw};x-=cw;return c});
  }
  function drawRow(cols,cells,bold,bg){
    font(19,bold);
    var lines=cells.map(function(v,i){return wrap(v,cols[i].w-pad*2)}),n=Math.max.apply(null,lines.map(function(l){return l.length})),h=n*LH+pad*2;
    if(y+h>PH-M-40)return h;
    if(bg){ctx.fillStyle=bg;ctx.fillRect(M,y,PW-2*M,h)}
    ctx.fillStyle=bold?'#14213d':'#1b1b1b';ctx.strokeStyle='#c4ccda';ctx.lineWidth=1;ctx.strokeRect(M,y,PW-2*M,h);
    lines.forEach(function(l,i){l.forEach(function(t,k){ctx.fillText(t,cols[i].r-pad,y+pad+k*LH)});ctx.beginPath();ctx.moveTo(cols[i].r-cols[i].w,y);ctx.lineTo(cols[i].r-cols[i].w,y+h);ctx.stroke()});
    y+=h;return 0;
  }
  function table(sec){
    var cols=columns(sec);
    function put(cells,bold,bg){if(drawRow(cols,cells,bold,bg)){newPage();drawRow(cols,sec.r[0],1,'#dce3f0');drawRow(cols,cells,bold,bg)}}
    font(26,1);ctx.fillStyle='#14213d';if(y+120>PH-M-40)newPage();ctx.fillText(sec.n,PW-M,y);y+=42;
    put(sec.r[0],1,'#dce3f0');
    sec.r.slice(1).forEach(function(r){put(r,0)});
    y+=24;
  }
  newPage();
  secs.forEach(table);
  pages.forEach(function(p,i){
    var c=p.getContext('2d');c.direction='ltr';c.textBaseline='top';c.fillStyle='#555';c.font='400 20px '+F;c.textAlign='center';
    c.fillText((i+1)+' / '+pages.length,PW/2,PH-M);
  });
  return packPdf(pages,PW,PH);
}
/* بسته‌بندی صفحه‌های canvas (JPEG) در یک PDF ساده */
function packPdf(pages,PW,PH){
  var enc=new TextEncoder(),chunks=[],len=0,offs=[],n=pages.length,N=2+3*n;
  function add(u){chunks.push(u);len+=u.length}
  function addS(s){add(enc.encode(s))}
  addS('%PDF-1.4\n');
  offs[1]=len;addS('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  var kids=[];for(var i=0;i<n;i++)kids.push((3+3*i)+' 0 R');
  offs[2]=len;addS('2 0 obj\n<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+n+' >>\nendobj\n');
  pages.forEach(function(p,i){
    var bin=atob(p.toDataURL('image/jpeg',0.9).split(',')[1]),u=new Uint8Array(bin.length);
    for(var k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);
    var po=3+3*i,co=4+3*i,io=5+3*i,cs='q 595 0 0 842 0 0 cm /Im0 Do Q';
    offs[po]=len;addS(po+' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 '+io+' 0 R >> >> /Contents '+co+' 0 R >>\nendobj\n');
    offs[co]=len;addS(co+' 0 obj\n<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream\nendobj\n');
    offs[io]=len;addS(io+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+PW+' /Height '+PH+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+u.length+' >>\nstream\n');add(u);addS('\nendstream\nendobj\n');
  });
  var xo=len,x='xref\n0 '+(N+1)+'\n0000000000 65535 f \n';
  for(var j=1;j<=N;j++)x+=('0000000000'+offs[j]).slice(-10)+' 00000 n \n';
  addS(x+'trailer\n<< /Size '+(N+1)+' /Root 1 0 R >>\nstartxref\n'+xo+'\n%%EOF');
  return new Blob(chunks,{type:'application/pdf'});
}
function dashExport(kind){

/* اولین خطای شماره‌های فرم باز کردن برگه؛ اگر خطایی نبود رشته‌ی خالی */
function createFormError(rec,tmc){
  var vKey=tmc?'':withP(rec.product||'',function(){return numErr(SHEETS[S.sheet].keyKind,S.key)});
  if(vKey)return vKey;
  var vTyped=tmc?'':withP(rec.product||'',function(){return typedErr(S.sheet,rec)});
  if(vTyped)return vTyped;
  var vDup=conflictFor(S.sheet,S.key,rec);
  return vDup?vDup+' اگر اشتباه ثبت شده، با کیفیت یا مدیر برنامه تماس بگیرید.':'';
}
/* خودرویی که فقط با سریال باز می‌شود باید به شاسی و اتاق وصل باشد؛ اگر این مرحله کار را تمام کرد true برمی‌گرداند */
function serialLinkStep(rec,I3){
  var needC=!(rec.chassisNo||I3.chassis),needR=!(rec.room||I3.room);
  if(needC||needR){S.formErr='این سریال هنوز به خودرو وصل نشده است. شماره شاسی و شماره اتاق را از روی برچسب شیشه وارد کنید تا به برگه‌های قبلی (شاسی، موتور، تزیینات) وصل شود.';render();return true}
  var typed=!!(rec.chassisNo||rec.room);
  if(typed){
    var ch=rec.chassisNo||I3.chassis,rm=rec.room||I3.room,bad='';
    S.data.insp.forEach(function(x){var o=identOf(x);if(!o.serial||o.serial===S.key)return;
      if(ch&&o.chassis===ch)bad='شاسی '+ch+' قبلاً به سریال '+o.serial+' وصل شده است.';
      if(rm&&o.room===rm)bad='اتاق '+rm+' قبلاً به سریال '+o.serial+' وصل شده است.'});
    if(bad){S.formErr=bad+' اگر اشتباه ثبت شده، مدیر باید اصلاح کند.';render();return true}
    var ce=insp('chassis',ch),w=[],te=insp('trim',rm);
    if(ce&&te&&prodOf(ce)!==prodOf(te)){S.formErr='محصول شاسی ('+PRODN[prodOf(ce)]+') با محصول اتاق ('+PRODN[prodOf(te)]+') یکی نیست. شماره‌ها را دوباره با برچسب شیشه مقایسه کنید.';render();return true}
    rec.product=carProd(S.key,[ce,te])||undefined;
    if(rec.product===undefined)delete rec.product;
    if(!ce)w.push('برگه شاسی '+ch+' هنوز ثبت نشده است.');
    if(!insp('trim',rm))w.push('برگه تزیینات اتاق '+rm+' هنوز ثبت نشده است.');
    var LK={sheet:S.sheet,key:S.key,rec:rec,chassis:ch,room:rm,engine:(ce&&ce.engine)||rec.engine||I3.engine||'',engineVerified:!!(ce&&ce.engine),fuel:(ce&&ce.fuel)||'',warn:w};
    var e3=digits(val('c_lk_eng')),fu3=val('c_lk_fuel');
    if(!w.length&&(!LK.engineVerified||e3.length===3)&&(!LK.fuel||fu3)){
      var le3=linkCheck(LK,e3,fu3);
      if(le3){S.formErr=le3;render();return true}
      S.formErr='';var lid=docId(S.sheet,S.key);
      saveOnce('open_'+lid,function(){return store.create('inspections',lid,rec)},'برگه باز شد');return true;
    }
    S.linkConfirm=LK;S.linkErr='';S.formErr='';render();return true;
  }
  return false;
}
/* برگه‌ی تازه را می‌سازد؛ بعد از بررسی شماره‌ها و اتصال سریال صدا زده می‌شود */
function openNewRecord(rec,tmc){
  if(PSHEETS.indexOf(S.sheet)<0&&!rec.product){var pp0=carProd(S.key);if(pp0)rec.product=pp0}
  S.formErr='';
  var isCh=S.sheet==='chassis'&&!tmc,uid3=docId(S.sheet,S.key);
  saveOnce('open_'+uid3,function(){return store.create('inspections',uid3,rec)},isCh?'برگه باز شد · '+fuelTxt(rec.fuel):'برگه باز شد').then(function(ok){
    if(!ok)return;
    if(isCh)fuelRemember(rec.fuel);
    if(!tmc&&rec.product)productRemember(rec.product);
    var engId=S.sheet==='chassis'?createEngineSheet(rec):'';
    if(isCh){S.undo={id:uid3,until:Date.now()+6000,fuel:rec.fuel,eng:engId};setTimeout(render,6200);render()}
  });
}
/* v159: با باز شدن شاسی، برگه‌ی موتور همان خودرو هم باز می‌شود تا شماره‌ها یک بار وارد شوند؛ اگر از قبل هست دست نمی‌خورد. شناسه‌ی برگه‌ی ساخته‌شده را برمی‌گرداند */
function createEngineSheet(chassisRec){
  var k=chassisRec.engine;
  if(!k||insp('engine',k)||!canEdit('engine',k))return '';
  var id=docId('engine',k),rec={sheet:'engine',key:k,createdBy:S.user.name,createdAt:nowIso(),formCode:FORM_CODE,formPage:SHEETS.engine.page,items:{},signs:{}};
  if(chassisRec.product)rec.product=chassisRec.product;
  if(chassisRec.test)rec.test=true;
  saveOnce('open_'+id,function(){return store.create('inspections',id,rec)},'',true);
  return id;
}
function submitCreate(){
  if(waitsForEwt1()){S.formErr='این شاسی هنوز توسط چکمن EWT1 باز نشده است.';render();return}
  var rec=Object.assign(idVals(S.sheet,'c_'),{sheet:S.sheet,key:S.key,createdBy:S.user.name,createdAt:nowIso(),formCode:FORM_CODE,formPage:SHEETS[S.sheet].page,items:{},signs:{}});
  var tmc=TM();if(tmc)rec.test=true;
  ensureCar([S.key,rec.engine,rec.chassisNo,rec.room,rec.serial]).then(function(){
    var err=createFormError(rec,tmc);
    if(err){S.formErr=err;render();return}
    if(SHEETS[S.sheet].keyKind==='serial'&&!tmc&&serialLinkStep(rec,identity(S.key)))return;
    openNewRecord(rec,tmc);
  });
}
function submitFuelCorrection(){
  var dq2=insp(S.sheet,S.key),Iq2=identity(S.key),chq=carRecords(S.key).recs.filter(function(x){return x.sheet==='chassis'&&x.fuel})[0],nf=val('cf_fuel'),rf=val('cf_reason'),ef='';
  if(!chq)ef='برگه شاسی با نوع سوخت پیدا نشد.';else if(nf!=='single'&&nf!=='dual')ef='نوع سوخت درست را انتخاب کنید.';else if(nf===chq.fuel)ef='نوع سوخت انتخابی با ثبت فعلی یکی است.';else if(rf.length<3)ef='دلیل اصلاح را بنویسید.';
  if(ef){S.corrErr=ef;render();return}
  S.corrErr='';
  var rf2={kind:'corr',field:'fuel',oldVal:chq.fuel,newVal:nf,reason:rf,sheet:S.sheet,key:S.key,chassisKey:chq.key,by:S.user.name,byId:S.user.id,station:S.user.station,at:nowIso(),status:'pending'},rfid='corr_'+uid();
  {
    rf2.status='applied';rf2.decidedBy=S.user.name;rf2.decidedById=S.user.id;rf2.decidedAt=rf2.at;
    saveOnce('corr',function(){return store.set('users',rfid,rf2).then(function(){return corrApply(Object.assign({id:rfid},rf2))})},'نوع سوخت اصلاح شد').then(function(ok){if(ok){S.corrOpen='';S.corrErr=''}render()});
  }
}
function submitCorrRequest(){
  var dq=insp(S.sheet,S.key),Iq=identity(S.key),fq=val('cr_f'),nq=digits(val('cr_new')),rq3=val('cr_reason'),oq=Iq[fq],eq='';
  if(!dq||!fq||!oq)eq='شماره‌ای که اشتباه است را انتخاب کنید.';
  else if(!nq)eq='شماره‌ی درست را وارد کنید.';
  else if(numErr(fq,nq))eq=numErr(fq,nq);
  else if(nq===oq)eq='شماره‌ی جدید با شماره‌ی قبلی یکی است.';
  else if(rq3.length<3)eq='دلیل اصلاح را بنویسید.';
  S.corrErr=eq;
  if(eq){render();return}
  ensureCar([nq]).then(function(){
    if(numTaken(fq,nq)){S.corrErr='این شماره قبلاً برای خودروی دیگری ثبت شده است؛ اگر آن هم اشتباه است با کیفیت هماهنگ کنید.';render();return}
    var at=nowIso(),rid='corr_'+uid(),rr={kind:'corr',field:fq,oldVal:oq,newVal:nq,reason:rq3,sheet:S.sheet,key:S.key,by:S.user.name,byId:S.user.id,station:S.user.station,at:at,status:'applied',decidedBy:S.user.name,decidedById:S.user.id,decidedAt:at};
    saveOnce('corr',function(){return store.set('users',rid,rr).then(function(){return corrApply(Object.assign({id:rid},rr))})},'شماره اصلاح شد').then(function(ok){if(ok){S.corrOpen='';S.corrErr=''}if(ok&&S.key===oq&&SHEETS[S.sheet].keyKind===fq){S.key=nq}render()});
  });

function submitIdentity(){
  var dI=insp(S.sheet,S.key);if(dI&&dI.final){toast('شماره‌ها بعد از تأیید نهایی قفل است؛ درخواست اصلاح بدهید.');return}
